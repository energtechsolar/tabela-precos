<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cmrndntnaaooapbdmgip.supabase.co;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Energtech</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --amarelo:#FFC107; --amarelo-dim:#e6ac00; --preto:#111; --bg:#0f0f0f; --card:#1a1a1a; --card2:#222;
    --borda:#2e2e2e; --texto:#e0e0e0; --muted:#8a8a8a; --verde:#4ade80; --vermelho:#f87171; --azul:#60a5fa; --laranja:#fb923c;
  }
  body { background:var(--bg); font-family:'Barlow',sans-serif; color:var(--texto); min-height:100vh; }
  a { color:var(--azul); }
  .header { background:var(--amarelo); padding:14px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .logo-area { display:flex; align-items:center; gap:12px; }
  .logo-icon { width:40px; height:40px; background:var(--preto); border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .brand-name { font-family:'Barlow Condensed',sans-serif; font-size:24px; font-weight:900; color:var(--preto); line-height:1; }
  .brand-sub { font-size:10px; font-weight:600; color:var(--preto); letter-spacing:.2em; text-transform:uppercase; opacity:.6; }
  .header-title { text-align:right; }
  .header-title h1 { font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:700; color:var(--preto); text-transform:uppercase; letter-spacing:.05em; }
  .header-links { font-size:12px; color:var(--preto); margin-top:3px; }
  .header-links a { color:var(--preto); font-weight:700; }
  .header-links .papel { opacity:.6; }

  .page { padding:16px; }
  .card { background:var(--card); border:1px solid var(--borda); border-radius:14px; padding:18px; }
  .muted { color:var(--muted); font-size:13px; }
  .login { max-width:360px; margin:40px auto; text-align:center; }
  .login h2 { font-family:'Barlow Condensed',sans-serif; color:var(--amarelo); margin-bottom:6px; }
  .input, .select, textarea.input { background:var(--card2); border:1px solid var(--borda); color:var(--texto); font-family:'Barlow',sans-serif; font-size:14px; padding:9px 11px; border-radius:8px; outline:none; width:100%; }
  .input:focus, .select:focus { border-color:var(--amarelo); }
  .login .input { margin-bottom:10px; }
  a.btn { text-decoration:none; display:inline-block; }
  .btn { background:var(--amarelo); color:var(--preto); font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:900; letter-spacing:.05em; padding:9px 14px; border:none; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .btn:hover { background:var(--amarelo-dim); }
  .btn:disabled { opacity:.6; cursor:wait; }
  .btn-sec { background:var(--card2); color:var(--texto); border:1px solid var(--borda); }
  .btn-sec:hover { background:#2a2a2a; }
  .btn-verde { background:#166534; color:#fff; }
  .btn-verde:hover { background:#15803d; }
  .btn-verm { background:#7f1d1d; color:#fff; }
  .btn-verm:hover { background:#991b1b; }
  .erro { color:var(--vermelho); font-size:13px; margin-top:8px; min-height:16px; }
  #conteudo { display:none; }

  /* barra de ferramentas */
  .barra { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
  .barra .input, .barra .select { width:auto; min-width:170px; }
  .barra .busca { flex:1; min-width:200px; }
  .chip { background:var(--card2); border:1px solid var(--borda); color:var(--texto); border-radius:20px; padding:7px 12px; font-size:13px; cursor:pointer; white-space:nowrap; }
  .chip.ativo { border-color:var(--amarelo); color:var(--amarelo); }
  .chip.alerta { border-color:#7f1d1d; color:var(--vermelho); }

  .resumo { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-bottom:12px; }
  .kpi { background:var(--card); border:1px solid var(--borda); border-radius:12px; padding:12px 14px; }
  .kpi-val { font-family:'Barlow Condensed',sans-serif; font-size:24px; font-weight:900; color:var(--amarelo); line-height:1.1; }
  .kpi-lbl { font-size:12px; color:var(--muted); margin-top:2px; }

  /* kanban */
  .kanban { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(250px, 1fr); gap:10px; overflow-x:auto; padding-bottom:10px; align-items:start; }
  .coluna { background:#141414; border:1px solid var(--borda); border-radius:12px; display:flex; flex-direction:column; max-height:calc(100vh - 250px); min-height:200px; }
  .coluna.sobre { border-color:var(--amarelo); background:#1a170c; }
  .col-topo { padding:10px 12px; border-bottom:1px solid var(--borda); }
  .col-nome { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; display:flex; justify-content:space-between; }
  .col-nome .qtd { color:var(--muted); font-weight:700; }
  .col-soma { font-size:12px; color:var(--muted); margin-top:2px; }
  .col-lista { padding:8px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; flex:1; }
  .col-ganho .col-nome { color:var(--verde); }
  .col-perdido .col-nome { color:var(--vermelho); }
  .lead { background:var(--card2); border:1px solid var(--borda); border-radius:10px; padding:10px 11px; cursor:pointer; font-size:13px; }
  .lead:hover { border-color:#555; }
  .lead.arrastando { opacity:.4; }
  .lead-nome { font-weight:600; color:#fff; margin-bottom:3px; }
  .lead-linha { color:var(--muted); font-size:12px; display:flex; justify-content:space-between; gap:6px; }
  .lead-valor { color:var(--amarelo); font-weight:600; }
  .lead-tags { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:20px; background:#1a1a1a; border:1px solid var(--borda); color:var(--muted); }
  .tag.atraso { color:var(--vermelho); border-color:#7f1d1d; }
  .tag.hoje { color:var(--laranja); border-color:#7c2d12; }
  .tag.resp { color:var(--azul); border-color:#1e3a5f; }
  .vazio { text-align:center; color:#555; font-size:12px; padding:14px 0; }

  /* ficha */
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; justify-content:flex-end; z-index:50; }
  .overlay.visivel { display:flex; }
  .ficha { background:var(--card); width:min(560px, 100%); height:100%; overflow-y:auto; border-left:1px solid var(--borda); padding:18px; }
  .ficha h2 { font-family:'Barlow Condensed',sans-serif; font-size:22px; color:#fff; }
  .ficha h3 { font-family:'Barlow Condensed',sans-serif; font-size:14px; letter-spacing:.1em; text-transform:uppercase; color:var(--amarelo); margin:18px 0 8px; }
  .grade { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .grade label, .campo label { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.05em; }
  .grade .largo { grid-column:1/-1; }
  .acoes { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .fechar { background:none; border:1px solid var(--borda); color:var(--texto); border-radius:8px; width:34px; height:34px; cursor:pointer; font-size:18px; }
  .ficha-topo { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .prop { background:var(--card2); border:1px solid var(--borda); border-radius:8px; padding:8px 10px; font-size:13px; display:flex; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .evento { border-left:2px solid var(--borda); padding:4px 0 8px 10px; font-size:13px; }
  .evento.nota { border-color:var(--amarelo); }
  .evento.proposta { border-color:var(--azul); }
  .evento .quando { font-size:11px; color:var(--muted); }
  .status-msg { font-size:12px; margin-top:8px; min-height:16px; color:var(--verde); }
  .status-msg.erro { color:var(--vermelho); }
  .modal { background:var(--card); border:1px solid var(--borda); border-radius:14px; padding:18px; width:min(420px, 92vw); margin:auto; }
  #ov-perda { justify-content:center; align-items:center; z-index:60; }
  @media (max-width:640px) { .grade { grid-template-columns:1fr; } .header-title { text-align:left; } }
</style>
</head>
<body>

<div class="header">
  <div class="logo-area">
    <div class="logo-icon"><svg width="26" height="26" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="13" fill="#FFC107"/><path d="M16 3L8 15h7l-3 10 10-13h-7l1-9z" fill="#111"/></svg></div>
    <div><div class="brand-name">Energtech</div><div class="brand-sub">Engenharia Solar</div></div>
  </div>
  <div class="header-title">
    <h1>CRM — Funil de Vendas</h1>
    <div class="header-links" id="header-links"><a href="./">Precificador</a></div>
  </div>
</div>

<div class="page">
  <div class="card login" id="login" style="display:none">
    <h2>🔑 Entrar</h2>
    <p class="muted" style="margin-bottom:16px">Use o mesmo login do precificador.</p>
    <input class="input" type="email" id="login-email" placeholder="E-mail" autocomplete="username">
    <input class="input" type="password" id="login-senha" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
    <button class="btn" id="login-btn" style="width:100%" onclick="entrar()">Entrar</button>
    <div class="erro" id="login-erro"></div>
  </div>
  <div class="card" id="aviso" style="display:none"><p id="aviso-txt" class="muted"></p></div>

  <div id="conteudo">
    <div class="resumo" id="resumo"></div>
    <div class="barra">
      <input class="input busca" id="f-busca" placeholder="🔎 Buscar nome, telefone ou cidade" oninput="render()">
      <select class="select" id="f-resp" onchange="render()"></select>
      <button class="chip" id="chip-follow" onclick="filtroFollow=!filtroFollow; render()">⏰ Follow-up</button>
      <button class="chip" id="chip-antigos" onclick="mostrarAntigos=!mostrarAntigos; render()">Ganhos/perdidos antigos</button>
      <button class="btn-sec btn" onclick="carregar(true)" title="Atualizar">🔄</button>
      <button class="btn" onclick="novoLead()">+ Novo lead</button>
    </div>
    <div class="kanban" id="kanban"></div>
    <p class="muted" style="margin-top:6px">Arraste os cards entre as colunas (no celular, abra o card e troque a etapa). Ganhos e perdidos mostram os últimos 30 dias.</p>
  </div>
</div>

<!-- FICHA DO CLIENTE -->
<div class="overlay" id="ov-ficha" onclick="if(event.target===this)fecharFicha()">
  <div class="ficha" id="ficha"></div>
</div>

<!-- MOTIVO DA PERDA -->
<div class="overlay" id="ov-perda" onclick="if(event.target===this)fecharPerda()">
  <div class="modal">
    <h3 style="font-family:'Barlow Condensed',sans-serif;color:var(--vermelho);font-size:18px;margin-bottom:10px">Marcar como perdido</h3>
    <div class="campo"><label>Motivo</label>
      <select class="select" id="perda-motivo">
        <option>Preço</option><option>Financiamento negado</option><option>Fechou com concorrente</option>
        <option>Desistiu / adiou</option><option>Sem retorno do cliente</option><option>Inviável tecnicamente</option><option>Outro</option>
      </select></div>
    <div class="campo" style="margin-top:10px"><label>Observação (opcional)</label><textarea class="input" id="perda-obs" rows="3"></textarea></div>
    <div class="acoes"><button class="btn btn-verm" onclick="confirmarPerda()">Confirmar perda</button><button class="btn btn-sec" onclick="fecharPerda()">Cancelar</button></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://cmrndntnaaooapbdmgip.supabase.co';
const SUPABASE_KEY = 'sb_publishable_wKf3jP-0lmaK07vMpxdRlA_UXqMJdBO';
const sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const ETAPAS = [
  ['novo', 'Lead novo'], ['atendimento', 'Em atendimento'], ['qualificado', 'Qualificado'], ['proposta', 'Proposta enviada'],
  ['negociacao', 'Negociação'], ['ganho', 'Ganho'], ['perdido', 'Perdido'],
];
const NOME_ETAPA = Object.fromEntries(ETAPAS);
const ORIGENS = { datacrazy:'Anúncio / DataCrazy', indicacao:'Indicação', whatsapp:'WhatsApp direto', telefone:'Telefone', loja:'Loja / visita', campo:'Prospecção em campo', outro:'Outro' };

let perfil = null, leads = [], orcs = [], equipe = [], filtroFollow = false, mostrarAntigos = false, arrastando = null, fichaId = null, perdaId = null;

const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtR0 = v => (+v || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });
const fmtR = v => (+v || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const fmtDH = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') + ' ' + new Date(iso).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }) : '';
const dias = iso => Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
const nomeDe = email => (equipe.find(e => e.email === email) || {}).nome || (email ? email.split('@')[0] : '');
function telBonito(t) {
  let d = String(t || '').replace(/\D/g, '');
  if (d.startsWith('55') && d.length >= 12) d = d.slice(2);
  if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return t || '';
}
function telWa(t) { let d = String(t || '').replace(/\D/g, ''); if (d.length === 10 || d.length === 11) d = '55' + d; return d; }
// data/hora local <-> input datetime-local
const paraInput = iso => { if (!iso) return ''; const d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };
const fimDeHoje = () => { const d = new Date(); d.setHours(23, 59, 59, 999); return d; };
function situacaoFollow(l) {
  if (!l.proximo_contato || l.etapa === 'ganho' || l.etapa === 'perdido') return null;
  const t = new Date(l.proximo_contato);
  if (t < new Date(new Date().setHours(0,0,0,0))) return 'atraso';
  if (t <= fimDeHoje()) return 'hoje';
  return 'futuro';
}

function mostrar(qual, texto) {
  $('login').style.display = qual === 'login' ? '' : 'none';
  $('aviso').style.display = qual === 'aviso' ? '' : 'none';
  $('conteudo').style.display = qual === 'conteudo' ? 'block' : 'none';
  if (texto) $('aviso-txt').innerHTML = texto;
}
function renderHeader() {
  let h = '<a href="./">📄 Precificador</a>';
  if (perfil && (perfil.admin || perfil.papel === 'interno')) h += ' · <a href="painel.html">📊 Orçamentos</a>';
  if (perfil) h += ` · 👤 ${esc(perfil.nome || perfil.email)} <span class="papel">(${esc(perfil.papel || (perfil.admin ? 'admin' : 'vendedor'))})</span> · <a href="#" onclick="sair();return false">Sair</a>`;
  $('header-links').innerHTML = h;
}

async function iniciar() {
  if (!sb) { mostrar('aviso', '⚠️ Sem conexão com o servidor. Verifique a internet e recarregue a página.'); return; }
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) { perfil = null; renderHeader(); mostrar('login'); setTimeout(() => $('login-email').focus(), 50); return; }
  const r = await sb.rpc('meu_perfil');
  perfil = r.data || { email: data.session.user.email };
  renderHeader();
  if (!perfil.vendedor) { mostrar('aviso', 'Seu usuário (' + esc(perfil.email) + ') ainda não tem acesso ao CRM. Fale com o administrador.'); return; }
  mostrar('conteudo');
  await carregar();
}
async function entrar() {
  const email = $('login-email').value.trim(), senha = $('login-senha').value;
  $('login-erro').textContent = '';
  if (!email || !senha) { $('login-erro').textContent = 'Preencha e-mail e senha.'; return; }
  $('login-btn').disabled = true; $('login-btn').textContent = 'Entrando…';
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  $('login-btn').disabled = false; $('login-btn').textContent = 'Entrar';
  if (error) { $('login-erro').textContent = 'E-mail ou senha incorretos.'; $('login-senha').value = ''; return; }
  await iniciar();
}
async function sair() { await sb.auth.signOut(); perfil = null; await iniciar(); }

async function carregar() {
  $('kanban').innerHTML = '<div class="muted">Carregando…</div>';
  const [l, o, v] = await Promise.all([
    sb.from('leads').select('id, nome, telefone, email, cidade, etapa, etapa_em, responsavel_email, proximo_contato, motivo_perda, origem, recebido_em').order('recebido_em', { ascending:false }).limit(2000),
    sb.from('orcamentos').select('id, lead_id, sistema, kwp, valor_final, tipo, vendedor_email, criado_em').order('criado_em', { ascending:false }).limit(5000),
    sb.from('vendedores').select('email, nome, papel'),
  ]);
  if (l.error) { mostrar('aviso', '⚠️ Erro ao carregar os leads: ' + esc(l.error.message) + '<br>Se o CRM acabou de ser instalado, confira se o script 07 foi aplicado no Supabase.'); return; }
  leads = l.data || []; orcs = o.data || []; equipe = (v.data || []).sort((a, b) => (a.nome || '').localeCompare(b.nome || ''));
  const sel = $('f-resp'), atual = sel.value;
  sel.innerHTML = '<option value="">Todos os responsáveis</option><option value="__eu">Só os meus</option><option value="__sem">Sem responsável</option>' +
    equipe.filter(e => e.papel !== 'engenheiro').map(e => `<option value="${esc(e.email)}">${esc(e.nome || e.email)}</option>`).join('');
  sel.value = atual || '';
  render();
  if (fichaId) abrirFicha(fichaId, true);
}

function ultimaProposta(leadId) { return orcs.find(o => o.lead_id === leadId) || null; }

function filtrados() {
  const q = $('f-busca').value.trim().toLowerCase(), qd = q.replace(/\D/g, '');
  const resp = $('f-resp').value;
  return leads.filter(l => {
    if (q) {
      const txt = ((l.nome || '') + ' ' + (l.cidade || '') + ' ' + (l.email || '')).toLowerCase();
      if (!txt.includes(q) && !(qd.length >= 4 && String(l.telefone || '').includes(qd))) return false;
    }
    if (resp === '__eu' && l.responsavel_email !== perfil.email) return false;
    if (resp === '__sem' && l.responsavel_email) return false;
    if (resp && !resp.startsWith('__') && l.responsavel_email !== resp) return false;
    if (filtroFollow && !['hoje', 'atraso'].includes(situacaoFollow(l))) return false;
    if (!mostrarAntigos && (l.etapa === 'ganho' || l.etapa === 'perdido') && dias(l.etapa_em) > 30) return false;
    return true;
  });
}

function render() {
  const lista = filtrados();
  // resumo
  const mes = new Date(); mes.setDate(1); mes.setHours(0,0,0,0);
  const abertos = leads.filter(l => !['ganho', 'perdido'].includes(l.etapa));
  const ganhosMes = leads.filter(l => l.etapa === 'ganho' && new Date(l.etapa_em) >= mes);
  const somaGanhos = ganhosMes.reduce((s, l) => s + (+(ultimaProposta(l.id) || {}).valor_final || 0), 0);
  const propMes = orcs.filter(o => new Date(o.criado_em) >= mes).length;
  const follow = leads.filter(l => ['hoje', 'atraso'].includes(situacaoFollow(l))).length;
  const perdidosMes = leads.filter(l => l.etapa === 'perdido' && new Date(l.etapa_em) >= mes).length;
  $('resumo').innerHTML = [
    [abertos.length, 'negócios em aberto'],
    [leads.filter(l => l.etapa === 'novo').length, 'leads novos aguardando'],
    [propMes, 'propostas no mês'],
    [ganhosMes.length + ' · ' + fmtR0(somaGanhos), 'ganhos no mês'],
    [perdidosMes, 'perdidos no mês'],
  ].map(([v, t]) => `<div class="kpi"><div class="kpi-val">${v}</div><div class="kpi-lbl">${t}</div></div>`).join('');
  $('chip-follow').textContent = '⏰ Follow-up para hoje (' + follow + ')';
  $('chip-follow').classList.toggle('ativo', filtroFollow);
  $('chip-follow').classList.toggle('alerta', !filtroFollow && follow > 0);
  $('chip-antigos').classList.toggle('ativo', mostrarAntigos);

  $('kanban').innerHTML = ETAPAS.map(([id, nome]) => {
    const itens = lista.filter(l => l.etapa === id).sort((a, b) => {
      const fa = a.proximo_contato ? new Date(a.proximo_contato).getTime() : Infinity, fb = b.proximo_contato ? new Date(b.proximo_contato).getTime() : Infinity;
      return fa - fb || new Date(b.etapa_em) - new Date(a.etapa_em);
    });
    const soma = itens.reduce((s, l) => s + (+(ultimaProposta(l.id) || {}).valor_final || 0), 0);
    return `<div class="coluna col-${id}" data-etapa="${id}" ondragover="sobreColuna(event,this)" ondragleave="this.classList.remove('sobre')" ondrop="soltar(event,this)">
      <div class="col-topo"><div class="col-nome">${nome}<span class="qtd">${itens.length}</span></div><div class="col-soma">${soma ? fmtR0(soma) + ' em propostas' : '&nbsp;'}</div></div>
      <div class="col-lista">${itens.map(cardLead).join('') || '<div class="vazio">—</div>'}</div></div>`;
  }).join('');
}

function cardLead(l) {
  const p = ultimaProposta(l.id), f = situacaoFollow(l), d = dias(l.etapa_em);
  const tags = [];
  if (f === 'atraso') tags.push(`<span class="tag atraso">⏰ atrasado ${new Date(l.proximo_contato).toLocaleDateString('pt-BR')}</span>`);
  if (f === 'hoje') tags.push(`<span class="tag hoje">⏰ hoje ${new Date(l.proximo_contato).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' })}</span>`);
  if (f === 'futuro') tags.push(`<span class="tag">⏰ ${new Date(l.proximo_contato).toLocaleDateString('pt-BR')}</span>`);
  if (l.responsavel_email) tags.push(`<span class="tag resp">${esc(nomeDe(l.responsavel_email).split(' ')[0])}</span>`);
  if (l.etapa === 'perdido' && l.motivo_perda) tags.push(`<span class="tag">${esc(l.motivo_perda)}</span>`);
  return `<div class="lead" draggable="true" data-id="${l.id}" ondragstart="iniciarArrasto(event,${l.id})" ondragend="this.classList.remove('arrastando')" onclick="abrirFicha(${l.id})">
    <div class="lead-nome">${esc(l.nome || 'Sem nome')}</div>
    <div class="lead-linha"><span>${esc(telBonito(l.telefone))}</span><span>${esc(l.cidade || '')}</span></div>
    ${p ? `<div class="lead-linha"><span>${esc(p.sistema || '')} · ${String(p.kwp).replace('.', ',')} kWp</span><span class="lead-valor">${fmtR0(p.valor_final)}</span></div>` : ''}
    <div class="lead-tags">${tags.join('')}<span class="tag" title="Dias nesta etapa">${d === 0 ? 'hoje' : d + 'd'}</span></div>
  </div>`;
}

// ── arrastar entre colunas ──
function iniciarArrasto(e, id) { arrastando = id; e.dataTransfer.effectAllowed = 'move'; e.currentTarget.classList.add('arrastando'); }
function sobreColuna(e, col) { if (arrastando) { e.preventDefault(); col.classList.add('sobre'); } }
function soltar(e, col) { e.preventDefault(); col.classList.remove('sobre'); const id = arrastando; arrastando = null; if (id) mudarEtapa(id, col.dataset.etapa); }

async function mudarEtapa(id, etapa, extra) {
  const l = leads.find(x => x.id === id);
  if (!l || (l.etapa === etapa && !extra)) return;
  if (etapa === 'perdido' && !(extra && extra.motivo_perda)) { abrirPerda(id); return; }
  if (etapa === 'ganho' && !confirm('Marcar "' + (l.nome || 'cliente') + '" como GANHO? 🎉')) { render(); if (fichaId === id) abrirFicha(id, true); return; }
  const mud = { etapa, atualizado_em: new Date().toISOString(), ...(extra || {}) };
  if (!l.responsavel_email) mud.responsavel_email = perfil.email;
  if (etapa === 'ganho' || etapa === 'perdido') mud.proximo_contato = null;
  const ant = { ...l };
  Object.assign(l, mud, { etapa_em: new Date().toISOString() });
  render();
  const { error } = await sb.from('leads').update(mud).eq('id', id);
  if (error) { Object.assign(l, ant); render(); alert('Não foi possível mudar a etapa: ' + error.message); return; }
  if (fichaId === id) abrirFicha(id, true);
}

// ── perda ──
function abrirPerda(id) { perdaId = id; $('perda-obs').value = ''; $('ov-perda').classList.add('visivel'); }
function fecharPerda() { perdaId = null; $('ov-perda').classList.remove('visivel'); render(); if (fichaId) abrirFicha(fichaId, true); }
async function confirmarPerda() {
  const id = perdaId, motivo = $('perda-motivo').value, obs = $('perda-obs').value.trim();
  $('ov-perda').classList.remove('visivel'); perdaId = null;
  await mudarEtapa(id, 'perdido', { motivo_perda: motivo });
  if (obs) await sb.from('lead_eventos').insert({ lead_id: id, texto: 'Motivo da perda: ' + obs });
  if (fichaId === id) abrirFicha(id, true);
}

// ── ficha do cliente ──
async function abrirFicha(id, recarregar) {
  const l = leads.find(x => x.id === id);
  if (!l) return;
  fichaId = id;
  const props = orcs.filter(o => o.lead_id === id);
  const opResp = '<option value="">— Sem responsável —</option>' + equipe.filter(e => e.papel !== 'engenheiro').map(e => `<option value="${esc(e.email)}" ${e.email === l.responsavel_email ? 'selected' : ''}>${esc(e.nome || e.email)}</option>`).join('');
  const opEtapa = ETAPAS.map(([k, n]) => `<option value="${k}" ${k === l.etapa ? 'selected' : ''}>${n}</option>`).join('');
  const opOrig = Object.entries(ORIGENS).map(([k, n]) => `<option value="${k}" ${k === (l.origem || 'datacrazy') ? 'selected' : ''}>${n}</option>`).join('');
  const wa = telWa(l.telefone);
  $('ficha').innerHTML = `
    <div class="ficha-topo">
      <div><h2>${esc(l.nome || 'Sem nome')}</h2><div class="muted">Recebido em ${fmtDH(l.recebido_em)} · ${esc(ORIGENS[l.origem] || l.origem || '')}</div></div>
      <button class="fechar" onclick="fecharFicha()">×</button>
    </div>
    <div class="acoes">
      ${wa ? `<a class="btn btn-verde" href="https://wa.me/${wa}" target="_blank" rel="noopener">💬 WhatsApp</a>` : ''}
      <a class="btn" href="./?lead=${id}">📄 Nova proposta</a>
      ${l.etapa !== 'ganho' ? `<button class="btn btn-verde" onclick="mudarEtapa(${id},'ganho')">🏆 Ganho</button>` : ''}
      ${l.etapa !== 'perdido' ? `<button class="btn btn-verm" onclick="mudarEtapa(${id},'perdido')">✕ Perdido</button>` : ''}
    </div>
    <h3>Negócio</h3>
    <div class="grade">
      <div><label>Etapa</label><select class="select" id="fx-etapa" onchange="mudarEtapa(${id}, this.value)">${opEtapa}</select></div>
      <div><label>Responsável</label><select class="select" id="fx-resp">${opResp}</select></div>
      <div><label>Próximo contato</label><input class="input" type="datetime-local" id="fx-prox" value="${paraInput(l.proximo_contato)}"></div>
      <div><label>Origem</label><select class="select" id="fx-origem">${opOrig}</select></div>
      ${l.etapa === 'perdido' ? `<div class="largo muted">Motivo da perda: <b>${esc(l.motivo_perda || '—')}</b></div>` : ''}
    </div>
    <h3>Contato</h3>
    <div class="grade">
      <div class="largo"><label>Nome</label><input class="input" id="fx-nome" value="${esc(l.nome)}"></div>
      <div><label>Telefone / WhatsApp</label><input class="input" id="fx-tel" value="${esc(telBonito(l.telefone))}"></div>
      <div><label>E-mail</label><input class="input" id="fx-email" value="${esc(l.email)}"></div>
      <div class="largo"><label>Cidade</label><input class="input" id="fx-cidade" value="${esc(l.cidade)}"></div>
    </div>
    <div class="acoes"><button class="btn" onclick="salvarFicha(${id})">💾 Salvar</button><span class="status-msg" id="fx-msg"></span></div>
    <h3>Propostas (${props.length})</h3>
    ${props.length ? props.map(p => `<div class="prop"><span>Nº ${String(p.id).padStart(5, '0')} · ${esc(p.sistema || '')} · ${String(p.kwp).replace('.', ',')} kWp<br><span class="muted">${fmtDH(p.criado_em)} · ${esc(nomeDe(p.vendedor_email))}</span></span><b style="color:var(--amarelo)">${fmtR(p.valor_final)}</b></div>`).join('')
      : '<div class="muted">Nenhuma proposta ainda. Use "Nova proposta".</div>'}
    <h3>Histórico e anotações</h3>
    <textarea class="input" id="fx-nota" rows="3" placeholder="Ex.: Ligou, pediu para retornar depois do dia 10. Quer financiar pela Caixa."></textarea>
    <div class="acoes"><button class="btn btn-sec" onclick="anotar(${id})">+ Adicionar anotação</button></div>
    <div id="fx-eventos" style="margin-top:12px"><div class="muted">Carregando…</div></div>`;
  $('ov-ficha').classList.add('visivel');
  const { data, error } = await sb.from('lead_eventos').select('tipo, texto, autor_email, criado_em').eq('lead_id', id).order('criado_em', { ascending:false }).limit(200);
  if (fichaId !== id) return;
  $('fx-eventos').innerHTML = error ? '<div class="muted">Não foi possível carregar o histórico.</div>'
    : (data.length ? data.map(e => `<div class="evento ${e.tipo}"><div class="quando">${fmtDH(e.criado_em)} · ${esc(nomeDe(e.autor_email) || 'sistema')}</div>${esc(e.texto)}</div>`).join('') : '<div class="muted">Sem registros ainda.</div>');
}
function fecharFicha() { fichaId = null; $('ov-ficha').classList.remove('visivel'); }

async function salvarFicha(id) {
  const l = leads.find(x => x.id === id);
  const prox = $('fx-prox').value;
  const mud = {
    nome: $('fx-nome').value.trim() || null,
    telefone: $('fx-tel').value.replace(/\D/g, '') || null,
    email: $('fx-email').value.trim() || null,
    cidade: $('fx-cidade').value.trim() || null,
    responsavel_email: $('fx-resp').value || null,
    origem: $('fx-origem').value,
    proximo_contato: prox ? new Date(prox).toISOString() : null,
    atualizado_em: new Date().toISOString(),
  };
  if (mud.telefone && (mud.telefone.length === 10 || mud.telefone.length === 11)) mud.telefone = '55' + mud.telefone;
  const { error } = await sb.from('leads').update(mud).eq('id', id);
  const msg = $('fx-msg');
  if (error) { msg.textContent = '⚠️ ' + error.message; msg.classList.add('erro'); return; }
  Object.assign(l, mud);
  msg.classList.remove('erro'); msg.textContent = '✅ Salvo';
  render();
}

async function anotar(id) {
  const txt = $('fx-nota').value.trim();
  if (!txt) return;
  const { error } = await sb.from('lead_eventos').insert({ lead_id: id, texto: txt });
  if (error) { alert('Não foi possível salvar a anotação: ' + error.message); return; }
  abrirFicha(id, true);
}

async function novoLead() {
  const nome = prompt('Nome do cliente:');
  if (!nome || !nome.trim()) return;
  const tel = (prompt('Telefone / WhatsApp (com DDD):') || '').replace(/\D/g, '');
  const reg = { nome: nome.trim(), telefone: tel ? (tel.length <= 11 ? '55' + tel : tel) : null, etapa: 'novo', origem: 'outro', responsavel_email: perfil.email, status: 'novo' };
  const { data, error } = await sb.from('leads').insert(reg).select('id, nome, telefone, email, cidade, etapa, etapa_em, responsavel_email, proximo_contato, motivo_perda, origem, recebido_em').single();
  if (error) { alert('Não foi possível criar o lead: ' + error.message); return; }
  leads.unshift(data); render(); abrirFicha(data.id);
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('ov-perda').classList.contains('visivel')) fecharPerda(); else fecharFicha(); } });
iniciar();
</script>
