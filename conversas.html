<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --amarelo:#FFC107; --amarelo-dim:#e6ac00; --preto:#111; --bg:#0f0f0f; --card:#1a1a1a; --card2:#222;
    --borda:#2e2e2e; --texto:#e0e0e0; --muted:#8a8a8a; --verde:#4ade80; --vermelho:#f87171; --azul:#60a5fa; --laranja:#fb923c;
  }
  html, body { height:100%; }
  body { background:var(--bg); font-family:'Barlow',sans-serif; color:var(--texto); display:flex; flex-direction:column; }
  a { color:var(--azul); }
  .header { background:var(--amarelo); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .logo-area { display:flex; align-items:center; gap:12px; }
  .logo-icon { width:38px; height:38px; background:var(--preto); border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .brand-name { font-family:'Barlow Condensed',sans-serif; font-size:22px; font-weight:900; color:var(--preto); line-height:1; }
  .brand-sub { font-size:10px; font-weight:600; color:var(--preto); letter-spacing:.2em; text-transform:uppercase; opacity:.6; }
  .header-title { text-align:right; }
  .header-title h1 { font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:700; color:var(--preto); text-transform:uppercase; letter-spacing:.05em; }
  .header-links { font-size:12px; color:var(--preto); margin-top:3px; }
  .header-links a { color:var(--preto); font-weight:700; }
  .card { background:var(--card); border:1px solid var(--borda); border-radius:14px; padding:18px; }
  .muted { color:var(--muted); font-size:13px; }
  .login { max-width:360px; margin:40px auto; text-align:center; }
  .input, textarea.input, .select { background:var(--card2); border:1px solid var(--borda); color:var(--texto); font-family:'Barlow',sans-serif; font-size:14px; padding:9px 11px; border-radius:8px; outline:none; width:100%; }
  .input:focus, textarea.input:focus { border-color:var(--amarelo); }
  .login .input { margin-bottom:10px; }
  .btn { background:var(--amarelo); color:var(--preto); font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:900; letter-spacing:.05em; padding:9px 14px; border:none; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .btn:hover { background:var(--amarelo-dim); } .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-sec { background:var(--card2); color:var(--texto); border:1px solid var(--borda); }
  .btn-p { padding:4px 9px; font-size:12px; }
  .erro { color:var(--vermelho); font-size:13px; margin-top:8px; min-height:16px; }
  #conteudo { display:none; flex:1; min-height:0; }
  .app { display:grid; grid-template-columns:330px 1fr; height:100%; min-height:0; }
  .lista { border-right:1px solid var(--borda); display:flex; flex-direction:column; min-height:0; background:#141414; }
  .lista-topo { padding:10px; border-bottom:1px solid var(--borda); display:flex; flex-direction:column; gap:8px; }
  .conversas { overflow-y:auto; flex:1; }
  .conv { padding:10px 12px; border-bottom:1px solid #222; cursor:pointer; display:flex; gap:10px; align-items:flex-start; }
  .conv:hover { background:#1c1c1c; } .conv.ativa { background:#1f1a0b; border-left:3px solid var(--amarelo); }
  .avatar { width:38px; height:38px; border-radius:50%; background:#2a2a2a; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--amarelo); flex-shrink:0; }
  .conv-meio { flex:1; min-width:0; }
  .conv-nome { font-weight:600; color:#fff; display:flex; justify-content:space-between; gap:6px; }
  .conv-nome span:last-child { font-weight:400; font-size:11px; color:var(--muted); white-space:nowrap; }
  .conv-prev { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .badge { background:var(--verde); color:#052e16; font-size:11px; font-weight:700; border-radius:10px; padding:0 6px; min-width:18px; text-align:center; }
  .tag { display:inline-block; font-size:10px; padding:0 6px; border-radius:20px; border:1px solid var(--borda); color:var(--muted); margin-left:4px; }
  .tag.leo { color:var(--azul); border-color:#1e3a5f; } .tag.lead { color:var(--verde); border-color:#1f4d33; }
  .chat { display:flex; flex-direction:column; min-height:0; }
  .chat-topo { padding:10px 16px; border-bottom:1px solid var(--borda); display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; background:#151515; }
  .chat-topo b { color:#fff; font-size:15px; }
  .msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:6px; background:#0c0c0c; }
  .bolha { max-width:72%; padding:7px 10px 4px; border-radius:10px; font-size:14px; line-height:1.35; white-space:pre-wrap; word-wrap:break-word; position:relative; }
  .bolha.entrada { align-self:flex-start; background:#1f1f1f; border-top-left-radius:2px; }
  .bolha.saida { align-self:flex-end; background:#14532d; border-top-right-radius:2px; }
  .bolha .rodape { font-size:10px; color:#a3a3a3; text-align:right; margin-top:2px; }
  .bolha .autor { font-size:10px; color:var(--amarelo); margin-bottom:2px; }
  .bolha img { max-width:260px; max-height:260px; border-radius:6px; display:block; cursor:pointer; }
  .bolha audio { width:240px; }
  .ok-lida { color:#38bdf8; } .falhou { color:var(--vermelho); }
  .dia { align-self:center; font-size:11px; color:var(--muted); background:#1a1a1a; border-radius:10px; padding:2px 10px; margin:6px 0; }
  .envio { border-top:1px solid var(--borda); padding:10px; display:flex; gap:8px; align-items:flex-end; background:#151515; }
  .envio textarea { resize:none; min-height:42px; max-height:140px; }
  .aviso-janela { background:#2a1f05; border:1px solid #7c5a00; color:#facc15; font-size:12px; padding:8px 12px; margin:0 10px 8px; border-radius:8px; }
  .vazio { text-align:center; color:var(--muted); padding:30px 10px; font-size:13px; }
  .ligar { border-bottom:1px solid var(--borda); padding:10px 16px; background:#171717; }
  .ligar-res { max-height:220px; overflow-y:auto; margin-top:8px; }
  .ligar-item { padding:7px 10px; border:1px solid var(--borda); border-radius:8px; margin-bottom:6px; cursor:pointer; font-size:13px; display:flex; justify-content:space-between; gap:8px; }
  .ligar-item:hover { border-color:var(--amarelo); }
  .anexo-chip { margin:0 10px 6px; display:flex; gap:8px; align-items:center; background:#1f1f1f; border:1px solid var(--borda); border-radius:8px; padding:6px 10px; font-size:13px; }
  .anexo-chip img { width:44px; height:44px; object-fit:cover; border-radius:4px; }
  .btn-ico { background:var(--card2); border:1px solid var(--borda); color:var(--texto); border-radius:8px; width:40px; height:42px; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .btn-ico:hover { border-color:var(--amarelo); }
  .rapidas { margin:0 10px 6px; background:#1a1a1a; border:1px solid var(--borda); border-radius:10px; max-height:260px; overflow-y:auto; }
  .rapida { padding:8px 12px; border-bottom:1px solid #262626; cursor:pointer; display:flex; gap:8px; justify-content:space-between; }
  .rapida:hover { background:#222; } .rapida b { color:var(--amarelo); font-size:13px; } .rapida .muted { font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .visor { position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:80; display:flex; flex-direction:column; }
  .visor-topo { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 14px; background:#151515; border-bottom:1px solid var(--borda); }
  .visor-topo b { color:#fff; flex:1; min-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .visor-corpo { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:10px; }
  .visor-corpo img { max-width:100%; max-height:100%; object-fit:contain; border-radius:6px; }
  .visor-corpo iframe { width:100%; height:100%; border:0; background:#fff; border-radius:6px; }
  .visor-ficha { display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:8px 14px; background:#111; border-top:1px solid var(--borda); font-size:13px; }
  .visor-ficha .select { width:auto; padding:5px 8px; font-size:13px; }
  .bolha .ver { cursor:pointer; }
  .agendadas { margin:0 10px 6px; }
  .agendada { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; background:#161b26; border:1px solid #1e3a5f; border-left:3px solid var(--azul); border-radius:8px; padding:6px 10px; font-size:12px; margin-bottom:4px; }
  .agendada.bloqueada, .agendada.falhou { border-left-color:var(--laranja); border-color:#7c2d12; background:#1f1610; }
  .agendada b { color:#fff; }
  .agendar { margin:0 10px 6px; background:#161b26; border:1px solid #1e3a5f; border-radius:10px; padding:8px 10px; font-size:13px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .agendar .input { width:auto; padding:5px 8px; font-size:13px; }
  .agendar .aviso { flex-basis:100%; font-size:12px; color:var(--muted); }
  .agendar .aviso.fora { color:#facc15; }
  .voltar { display:none; }
  @media (max-width:760px) {
    .app { grid-template-columns:1fr; }
    .app.aberta .lista { display:none; } .app:not(.aberta) .chat { display:none; }
    .voltar { display:inline-block; } .bolha { max-width:88%; } .header-title { text-align:left; }
  }
</style>
</head>
<body>
<div class="header">
  <div class="logo-area">
    <div class="logo-icon"><svg width="24" height="24" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="13" fill="#FFC107"/><path d="M16 3L8 15h7l-3 10 10-13h-7l1-9z" fill="#111"/></svg></div>
    <div><div class="brand-name">Energtech</div><div class="brand-sub">Engenharia Solar</div></div>
  </div>
  <div class="header-title"><h1>💬 Conversas WhatsApp</h1><div class="header-links" id="header-links"><a href="crm.html">CRM</a></div></div>
</div>

<div class="card login" id="login" style="display:none">
  <h2 style="font-family:'Barlow Condensed',sans-serif;color:var(--amarelo)">🔑 Entrar</h2>
  <p class="muted" style="margin-bottom:16px">Use o mesmo login do CRM.</p>
  <input class="input" type="email" id="login-email" placeholder="E-mail" autocomplete="username">
  <input class="input" type="password" id="login-senha" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
  <button class="btn" style="width:100%" onclick="entrar()">Entrar</button>
  <div class="erro" id="login-erro"></div>
</div>
<div class="card" id="aviso" style="display:none;margin:20px"><p id="aviso-txt" class="muted"></p></div>

<div id="conteudo">
  <div class="app" id="app">
    <div class="lista">
      <div class="lista-topo">
        <input class="input" id="busca" placeholder="🔎 Buscar nome ou telefone" oninput="renderLista()">
        <select class="select" id="f-canal" onchange="renderLista()"></select>
      </div>
      <div class="conversas" id="conversas"></div>
    </div>
    <div class="chat" id="chat"><div class="vazio" style="margin:auto">Escolha uma conversa à esquerda.</div></div>
  </div>
</div>

<script src="js/comum.js?v=20261019a"></script>
<script>
// Eider Sistemas / CRM — Conversas do WhatsApp (admin e vendas internas)
// Lê conversas e mensagens do banco (gravadas pela função whatsapp-webhook) e responde pela função whatsapp-enviar,
// que fala com o provedor (Meta, Z-API...). A tela não conhece o provedor nem o token.
// Atualiza ao vivo (Realtime). Fotos/áudios/PDFs ficam no bucket privado "whatsapp" (link temporário).
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hora = iso => iso ? new Date(iso).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }) : '';
const diaBR = iso => { const d = new Date(iso), h = new Date(); const ontem = new Date(); ontem.setDate(h.getDate() - 1);
  if (d.toDateString() === h.toDateString()) return 'Hoje'; if (d.toDateString() === ontem.toDateString()) return 'Ontem'; return d.toLocaleDateString('pt-BR'); };
const quando = iso => { if (!iso) return ''; const d = new Date(iso); return d.toDateString() === new Date().toDateString() ? hora(iso) : d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }); };
function telBonito(t) { let d = String(t || '').replace(/\D/g, ''); if (d.startsWith('55') && d.length >= 12) d = d.slice(2); if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return '+' + d; }
const JANELA_MS = 24 * 3600 * 1000;
let perfil = null, CANAIS = [], CONVS = [], MSGS = [], aberta = null, ULT = {}, urlsMidia = {}, canalRT = null, painelLigar = false;
let anexo = null, RESPOSTAS = [], painelRapidas = false, filtroRapidas = '';   // arquivo escolhido para enviar · mensagens rápidas
let painelDocs = false, DOCS_LEAD = null, PROPS_LEAD = [];   // documentos da ficha do lead (para enviar pelo WhatsApp)
let AGENDADAS = [], painelAgendar = false, reagendando = null;   // mensagens agendadas da conversa aberta
const TIPOS_FICHA = [['fatura', 'Fatura de energia'], ['cnh', 'CNH / RG'], ['disjuntor', 'Foto do disjuntor'], ['padrao', 'Foto do padrão de entrada'], ['transformador', 'Foto do transformador']];

function mostrar(qual, texto) {
  $('login').style.display = qual === 'login' ? '' : 'none';
  $('aviso').style.display = qual === 'aviso' ? '' : 'none';
  $('conteudo').style.display = qual === 'conteudo' ? 'block' : 'none';
  if (texto) $('aviso-txt').innerHTML = texto;
}
function renderHeader() {
  let h = '<a href="crm.html">🗂 CRM</a>';
  if (perfil) h += ` · 👤 ${esc(perfil.nome || perfil.email)} · <a href="#" onclick="sair();return false">Sair</a>`;
  $('header-links').innerHTML = h;
}
async function iniciar() {
  if (!sb) { mostrar('aviso', '⚠ Sem conexão com o servidor.'); return; }
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) { perfil = null; renderHeader(); mostrar('login'); return; }
  const r = await sb.rpc('meu_perfil'); perfil = r.data || {};
  renderHeader();
  if (!(perfil.admin || perfil.papel === 'interno')) { mostrar('aviso', 'As conversas do WhatsApp são do administrador e de vendas internas.'); return; }
  mostrar('conteudo');
  await carregar();
  carregarRespostas();
  ouvir();
  const q = new URLSearchParams(location.search).get('conversa');
  if (q && CONVS.some(c => c.id === +q)) abrir(+q);
}
async function entrar() {
  const { error } = await sb.auth.signInWithPassword({ email: $('login-email').value.trim(), password: $('login-senha').value });
  if (error) { $('login-erro').textContent = 'E-mail ou senha incorretos.'; return; }
  await iniciar();
}
async function sair() { await sb.auth.signOut(); perfil = null; await iniciar(); }

async function carregar() {
  const [c, v] = await Promise.all([
    sb.from('whatsapp_canais').select('id, nome, numero, finalidade, provedor, leo_ativo, ativo').order('id'),
    sb.from('whatsapp_conversas').select('*, leads(nome)').order('ultima_msg_em', { ascending: false, nullsFirst: false }).limit(500),
  ]);
  if (c.error || v.error) { $('conversas').innerHTML = `<div class="vazio">⚠ ${esc((c.error || v.error).message)}</div>`; return; }
  CANAIS = c.data || []; CONVS = v.data || [];
  const sel = $('f-canal'), atual = sel.value;
  sel.innerHTML = '<option value="">Todos os números</option>' + CANAIS.map(x => `<option value="${x.id}">${esc(x.nome)} · ${esc(telBonito(x.numero))}</option>`).join('');
  sel.value = atual; sel.style.display = CANAIS.length > 1 ? '' : 'none';
  await carregarUltimas();
  renderLista();
}
// última mensagem de cada conversa (prévia na lista)
async function carregarUltimas() {
  const ids = CONVS.map(c => c.id); if (!ids.length) return;
  const { data } = await sb.from('whatsapp_mensagens').select('conversa_id, direcao, tipo, texto, criado_em').in('conversa_id', ids).order('criado_em', { ascending: false }).limit(1000);
  ULT = {}; (data || []).forEach(m => { if (!ULT[m.conversa_id]) ULT[m.conversa_id] = m; });
}
const ICONE = { imagem: '📷 Foto', audio: '🎤 Áudio', video: '🎬 Vídeo', documento: '📄 Documento', localizacao: '📍 Localização', modelo: '📋 Mensagem modelo' };
const previa = m => m ? (m.direcao === 'saida' ? '✓ ' : '') + (m.texto || ICONE[m.tipo] || '') : '';
const nomeConv = c => (c.leads && c.leads.nome) || c.nome_contato || telBonito(c.telefone);

function renderLista() {
  const q = $('busca').value.trim().toLowerCase(), qd = q.replace(/\D/g, ''), canal = +$('f-canal').value || 0;
  const lista = CONVS.filter(c => (!canal || c.canal_id === canal) &&
    (!q || nomeConv(c).toLowerCase().includes(q) || (qd.length >= 3 && c.telefone.includes(qd))));
  $('conversas').innerHTML = lista.length ? lista.map(c => `<div class="conv ${aberta === c.id ? 'ativa' : ''}" onclick="abrir(${c.id})">
      <div class="avatar">${esc(nomeConv(c).trim().charAt(0).toUpperCase() || '?')}</div>
      <div class="conv-meio">
        <div class="conv-nome"><span>${esc(nomeConv(c))}${c.lead_id ? '<span class="tag lead">lead</span>' : ''}${c.atendimento === 'leo' ? '<span class="tag leo">Léo</span>' : ''}</span><span>${quando(c.ultima_msg_em)}</span></div>
        <div class="conv-prev" style="display:flex;justify-content:space-between;gap:6px"><span style="overflow:hidden;text-overflow:ellipsis">${esc(previa(ULT[c.id]))}</span>${c.nao_lidas ? `<span class="badge">${c.nao_lidas}</span>` : ''}</div>
      </div></div>`).join('')
    : `<div class="vazio">${CONVS.length ? 'Nada encontrado.' : 'Nenhuma conversa ainda. Quando um cliente mandar mensagem, ela aparece aqui.'}</div>`;
}

async function abrir(id) {
  if (aberta !== id) { painelLigar = false; painelRapidas = false; painelDocs = false; DOCS_LEAD = null; painelAgendar = false; reagendando = null; AGENDADAS = []; tirarAnexo(true); }
  aberta = id; $('app').classList.add('aberta');
  const c = CONVS.find(x => x.id === id); if (!c) return;
  history.replaceState(null, '', '?conversa=' + id);
  const { data, error } = await sb.from('whatsapp_mensagens').select('id, direcao, tipo, texto, midia_path, midia_mime, status, erro, autor, criado_em').eq('conversa_id', id).order('criado_em').limit(1000);
  if (error) { $('chat').innerHTML = `<div class="vazio">⚠ ${esc(error.message)}</div>`; return; }
  MSGS = data || [];
  await carregarAgendadas(id);
  renderChat(true);
  if (c.nao_lidas) { c.nao_lidas = 0; renderLista(); await sb.from('whatsapp_conversas').update({ nao_lidas: 0 }).eq('id', id); }
  else renderLista();
}
function janelaAberta(c) { return c.ultima_entrada_em && Date.now() - new Date(c.ultima_entrada_em).getTime() < JANELA_MS; }
function tique(m) {
  if (m.direcao !== 'saida') return '';
  if (m.status === 'falhou') return ` <span class="falhou" title="${esc(m.erro || '')}">⚠ não enviada</span>`;
  return { pendente: ' 🕓', enviada: ' ✓', entregue: ' ✓✓', lida: ' <span class="ok-lida">✓✓</span>' }[m.status] || '';
}
function corpo(m) {
  const u = m.midia_path ? urlsMidia[m.midia_path] : null;
  let h = '';
  if (m.midia_path) {
    if (!u) h += `<div class="muted" data-midia="${esc(m.midia_path)}">⏳ carregando ${esc((ICONE[m.tipo] || 'arquivo').toLowerCase())}…</div>`;
    else if (m.tipo === 'imagem') h += `<img class="ver" src="${u}" alt="foto" title="Ver" onclick="abrirVisor('${m.id}')">`;
    else if (m.tipo === 'audio') h += `<audio controls src="${u}"></audio>`;
    else if (m.tipo === 'video') h += `<video controls src="${u}" style="max-width:260px"></video>`;

// ── anexos: foto, PDF, documento, vídeo, áudio (limites do WhatsApp: foto 5 MB, vídeo/áudio 16 MB, documento 100 MB) ──
const tamTxt = b => b > 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
// foto que o WhatsApp não mostra como foto (HEIC, WEBP...) ou grande demais: converte para JPG no próprio aparelho
function fotoJpg(arquivo, maxPx) {
  return new Promise((ok, falha) => {
    const img = new Image(), url = URL.createObjectURL(arquivo);
    img.onload = () => { const e = Math.min(1, maxPx / Math.max(img.width, img.height)); const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * e); cv.height = Math.round(img.height * e); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url); cv.toBlob(b => b ? ok(b) : falha(new Error('conversão')), 'image/jpeg', 0.85); };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('formato')); };
    img.src = url;
  });
}
async function escolherAnexo(input) {

  let arquivo = f, mime = (f.type || 'application/octet-stream').toLowerCase(), nome = f.name || 'arquivo', aviso = '';
  if (mime.startsWith('image/') && (!/^image\/(jpeg|png)$/.test(mime) || f.size > 4.8 * 1048576)) {
    try { arquivo = await fotoJpg(f, 2000); mime = 'image/jpeg'; nome = nome.replace(/\.[^.]+$/, '') + '.jpg'; aviso = 'convertida para JPG'; }
    catch (_) { aviso = 'vai como documento'; }
  }
  const tipo = /^image\/(jpeg|png)$/.test(mime) ? 'imagem' : /^video\/(mp4|3gpp)$/.test(mime) ? 'video' : /^audio\//.test(mime) ? 'audio' : 'documento';
  const max = { imagem: 5, video: 16, audio: 16, documento: 100 }[tipo];
  if (arquivo.size > max * 1048576) { alert(`Arquivo grande demais: o WhatsApp aceita até ${max} MB para ${tipo === 'documento' ? 'documentos' : tipo === 'imagem' ? 'fotos' : tipo + 's'}.`); return; }
  if (tipo === 'video' && !/mp4|3gpp/.test(mime)) aviso = 'vai como documento';
  anexo = { arquivo, mime, nome, aviso, previa: tipo === 'imagem' ? URL.createObjectURL(arquivo) : '' };
  renderChat(true);
  if ($('texto')) $('texto').focus();
}

  painelDocs = !painelDocs; painelRapidas = false;
  if (painelDocs && DOCS_LEAD === null) {
    const [l, o] = await Promise.all([
      sb.from('leads').select('documentos').eq('id', c.lead_id).maybeSingle(),
      sb.from('orcamentos').select('id, sistema, kwp, valor_final, criado_em').eq('lead_id', c.lead_id).order('criado_em', { ascending: false }).limit(8),
    ]);
    DOCS_LEAD = ((l.data && l.data.documentos) || []).filter(d => d && d.path);
    PROPS_LEAD = o.data || [];
  }
  renderChat(false);
}
function htmlDocs() {
  const rot = t => (TIPOS_FICHA.find(x => x[0] === t) || [t, t])[1];
  const lista = DOCS_LEAD || [];
  return (lista.length ? lista.map((d, i) => `<div class="rapida" onclick="escolherDocFicha(${i})"><span style="min-width:0;flex:1"><b>${esc(rot(d.tipo))}</b><div class="muted">${esc(d.nome || d.path.split('/').pop())}${d.em ? ' · ' + new Date(d.em).toLocaleDateString('pt-BR') : ''}</div></span><span class="muted">enviar ›</span></div>`).join('')
    : '<div class="rapida muted">Nenhum documento na ficha deste lead ainda.</div>')
    + PROPS_LEAD.map(p => `<div class="rapida" onclick="enviarPropostaSalva(${p.id})"><span style="min-width:0;flex:1"><b>📄 Proposta Nº ${String(p.id).padStart(5, '0')}</b><div class="muted">${esc(p.sistema || '')}${+p.kwp ? ' · ' + String(p.kwp).replace('.', ',') + ' kWp' : ''} · R$ ${(+p.valor_final || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 })} · ${new Date(p.criado_em).toLocaleDateString('pt-BR')}</div></span><span class="muted">gerar e enviar ›</span></div>`).join('');
}
// a proposta é gerada no precificador (mesmo PDF de sempre) e enviada direto nesta conversa
function enviarPropostaSalva(id) {
  const c = CONVS.find(x => x.id === aberta); if (!c) return;
  if (!confirm('Gerar o PDF da proposta Nº ' + String(id).padStart(5, '0') + ' e enviar nesta conversa?\n\nAbre o precificador numa aba nova; quando aparecer "enviada", pode fechar a aba.')) return;
  painelDocs = false; renderChat(false);
  window.open('index.html?pdf=' + id + '&wa=' + c.id, '_blank');
}
function escolherDocFicha(i) {
  const d = (DOCS_LEAD || [])[i]; if (!d) return;
  if (anexo && anexo.previa) URL.revokeObjectURL(anexo.previa);
  anexo = { doc_path: d.path, nome: d.nome || d.path.split('/').pop(), arquivo: null, mime: '', aviso: '', previa: '' };
  painelDocs = false; renderChat(true);
  if ($('texto')) $('texto').focus();
}

// ── visualizador: foto ou PDF por cima da conversa, sem baixar; salvar na ficha do lead e ler fatura / CNH ──
function abrirVisor(id) {
  const m = MSGS.find(x => String(x.id) === String(id)), c = CONVS.find(x => x.id === aberta);
  const u = m && m.midia_path ? urlsMidia[m.midia_path] : null; if (!u || !c) return;
  const ehPdf = /pdf/i.test(m.midia_mime || '') || /\.pdf$/i.test(m.midia_path);
  const nome = m.tipo === 'documento' ? (m.texto || 'documento') : (ICONE[m.tipo] || 'arquivo');
  const corpoV = m.tipo === 'imagem' ? `<img src="${u}" alt="foto">`
    : ehPdf ? `<iframe src="${u}" title="PDF"></iframe>`
    : m.tipo === 'video' ? `<video controls src="${u}" style="max-width:100%;max-height:100%"></video>`
    : m.tipo === 'audio' ? `<audio controls src="${u}"></audio>`
    : '<div class="muted">Este tipo de arquivo não tem pré-visualização: use "Abrir em nova aba" ou "Baixar".</div>';
  const salvavel = m.direcao === 'entrada' && (m.tipo === 'imagem' || ehPdf);
  const ficha = !salvavel ? '' : c.lead_id
    ? `<div class="visor-ficha"><span>💾 Salvar na ficha do lead como</span>
        <select class="select" id="visor-tipo">${TIPOS_FICHA.map(([k, r]) => `<option value="${k}">${r}</option>`).join('')}</select>
        <button class="btn btn-sec btn-p" onclick="salvarNaFicha('${m.id}', false)">Salvar</button>
        <button class="btn btn-p" onclick="salvarNaFicha('${m.id}', 'fatura')">🔎 Ler fatura</button>
        <button class="btn btn-p" onclick="salvarNaFicha('${m.id}', 'cnh')">🪪 Ler CNH / RG</button>
        <span class="muted" id="visor-msg"></span></div>`
    : '<div class="visor-ficha muted">Para salvar este arquivo na ficha (e ler fatura ou CNH), ligue a conversa a um lead: "🔗 Ligar a um lead".</div>';
  fecharVisor();
  const v = document.createElement('div'); v.className = 'visor'; v.id = 'visor';
  v.innerHTML = `<div class="visor-topo"><b>${esc(nome)}</b>
      <a class="btn btn-sec btn-p" href="${u}" target="_blank" rel="noopener">↗ Abrir em nova aba</a>
      <button class="btn btn-sec btn-p" onclick="baixarMidia('${m.id}')">⬇ Baixar</button>
      <button class="btn btn-sec btn-p" onclick="fecharVisor()">✕ Fechar</button></div>
    <div class="visor-corpo" onclick="if(event.target===this)fecharVisor()">${corpoV}</div>${ficha}`;
  document.body.appendChild(v);
}
function fecharVisor() { const v = $('visor'); if (v) v.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharVisor(); });
async function baixarMidia(id) {
  const m = MSGS.find(x => String(x.id) === String(id)); if (!m) return;
  const nome = (m.tipo === 'documento' && m.texto) || m.midia_path.split('/').pop();
  const { data, error } = await sb.storage.from('whatsapp').createSignedUrl(m.midia_path, 600, { download: nome });
  if (error || !data) { alert('⚠ Não foi possível baixar: ' + (error ? error.message : '')); return; }
  const a = document.createElement('a'); a.href = data.signedUrl; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
}
// copia o arquivo da conversa para a pasta privada "documentos" do lead e coloca na ficha; "ler" abre a ficha já lendo os dados
async function salvarNaFicha(id, ler) {
  const m = MSGS.find(x => String(x.id) === String(id)), c = CONVS.find(x => x.id === aberta); if (!m || !c || !c.lead_id) return;
  const tipo = ler || ($('visor-tipo') || {}).value || 'fatura', msg = $('visor-msg');
  const aviso = t => { if (msg) msg.textContent = t; };
  aviso('⏳ Salvando na ficha…');
  try {
    const dl = await sb.storage.from('whatsapp').download(m.midia_path);
    if (dl.error || !dl.data) throw new Error('não consegui abrir o arquivo');
    const ehPdf = /pdf/i.test(m.midia_mime || dl.data.type || '') || /\.pdf$/i.test(m.midia_path);
    const ext = ehPdf ? 'pdf' : /png/i.test(m.midia_mime || dl.data.type || '') ? 'png' : 'jpg';
    const path = 'lead-' + c.lead_id + '/' + tipo + '-' + Date.now() + '.' + ext;
    const up = await sb.storage.from('documentos').upload(path, dl.data, { contentType: ehPdf ? 'application/pdf' : (ext === 'png' ? 'image/png' : 'image/jpeg'), upsert: false });
    if (up.error) throw new Error(up.error.message);
    const { data: l, error: eL } = await sb.from('leads').select('documentos').eq('id', c.lead_id).maybeSingle();
    if (eL || !l) throw new Error('não consegui abrir a ficha do lead');
    const docId = String(Date.now());
    const nome = (m.tipo === 'documento' && m.texto) || (TIPOS_FICHA.find(x => x[0] === tipo) || [, tipo])[1] + '.' + ext;
    const docs = [...(l.documentos || []), { id: docId, tipo, nome: nome + ' (WhatsApp)', path, em: new Date().toISOString(), autor: perfil.email, origem: 'whatsapp' }];
    const { error: eU } = await sb.from('leads').update({ documentos: docs, atualizado_em: new Date().toISOString() }).eq('id', c.lead_id);
    if (eU) { await sb.storage.from('documentos').remove([path]); throw new Error(eU.message); }
    DOCS_LEAD = null;
    if (ler) { aviso('✅ Salvo. Abrindo a ficha para ler os dados…'); window.open('crm.html?lead=' + c.lead_id + '&ler=' + docId, '_blank'); }
    else aviso('✅ Salvo na ficha do lead.');
  } catch (e) { aviso('⚠ Não foi possível salvar: ' + (e.message || e)); }
}

// ── ligar a conversa a um lead (ou criar o lead a partir dela) ──
const soDig = t => String(t || '').replace(/\D/g, '');
// número do WhatsApp (às vezes sem o 9 do celular) → formato dos leads: 55 + DDD + 9 + 8 dígitos
function telLead(t) { let d = soDig(t); if (d.length === 12 && d.startsWith('55') && /[6-9]/.test(d[4])) d = d.slice(0, 4) + '9' + d.slice(4); return d; }
let ligarBusca = '', ligarRes = [], ligarTimer = null;
function abrirLigar() {
  const c = CONVS.find(x => x.id === aberta); if (!c) return;
  painelLigar = !painelLigar; ligarBusca = ''; ligarRes = [];
  renderChat(false);
  if (painelLigar) buscarLeads(soDig(c.telefone).slice(-8), true);   // já procura pelo telefone
}
function montarLigar() {
  const el = $('ligar'); if (!el) return;
  el.style.display = 'block';
  el.innerHTML = `<div style="display:flex;gap:8px;align-items:center">
      <input class="input" id="ligar-q" placeholder="🔎 Nome, telefone ou cidade do lead" value="${esc(ligarBusca)}" oninput="ligarBusca=this.value;clearTimeout(ligarTimer);ligarTimer=setTimeout(()=>buscarLeads(this.value),300)">
      <button class="btn btn-sec btn-p" onclick="painelLigar=false;renderChat(false)">Fechar</button></div>
    <div class="ligar-res">${ligarRes.length ? ligarRes.map(l => `<div class="ligar-item" onclick="ligarLead(${l.id})"><span><b>${esc(l.nome || 'Sem nome')}</b> <span class="muted">${esc(telBonito(l.telefone))}${l.cidade ? ' · ' + esc(l.cidade) : ''}</span></span><span class="muted">${esc(l.etapa || '')}${l.arquivado ? ' · arquivado' : ''}</span></div>`).join('')
      : `<div class="muted" style="padding:6px 0">${ligarBusca || ligarRes.vazio ? 'Nenhum lead encontrado. Use ➕ Criar lead.' : 'Digite para procurar.'}</div>`}</div>`;
  const q = $('ligar-q'); if (q && document.activeElement !== q && !ligarRes.vazio) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}
async function buscarLeads(q, peloTelefone) {
  q = String(q || '').trim(); const d = soDig(q);
  if (!q) { ligarRes = []; montarLigar(); return; }
  let req = sb.from('leads').select('id, nome, telefone, cidade, etapa, arquivado').order('recebido_em', { ascending: false }).limit(12);
  req = d.length >= 4 ? req.like('telefone', '%' + d.slice(-8) + '%') : req.or(`nome.ilike.%${q.replace(/[%,()]/g, ' ')}%,cidade.ilike.%${q.replace(/[%,()]/g, ' ')}%`);
  const { data, error } = await req;
  ligarRes = error ? [] : (data || []); if (!ligarRes.length) ligarRes.vazio = true;
  if (peloTelefone && !ligarRes.length) ligarBusca = '';
  montarLigar();
}
async function ligarLead(leadId) {
  const c = CONVS.find(x => x.id === aberta); if (!c) return;
  const { error } = await sb.from('whatsapp_conversas').update({ lead_id: leadId }).eq('id', c.id);
  if (error) { alert('⚠ ' + error.message); return; }
  painelLigar = false; await recarregarConversa(c.id);
}
async function desligarLead() {
  const c = CONVS.find(x => x.id === aberta); if (!c || !confirm('Desligar esta conversa do lead? (o lead continua no CRM)')) return;
  const { error } = await sb.from('whatsapp_conversas').update({ lead_id: null }).eq('id', c.id);
  if (error) { alert('⚠ ' + error.message); return; }
  await recarregarConversa(c.id);
}
async function criarLead() {
  const c = CONVS.find(x => x.id === aberta); if (!c) return;
  const nome = prompt('Nome do lead:', c.nome_contato || ''); if (nome === null) return;
  const tel = telLead(c.telefone);
  // evita lead duplicado: mesmo telefone já cadastrado
  const { data: ja } = await sb.from('leads').select('id, nome').like('telefone', '%' + tel.slice(-8)).limit(1);
  if (ja && ja.length && confirm(`Já existe o lead "${ja[0].nome || 'Sem nome'}" com esse telefone. Ligar a conversa a ele em vez de criar outro?`)) { await ligarLead(ja[0].id); return; }
  const { data, error } = await sb.from('leads').insert({ nome: nome.trim() || 'Lead ' + telBonito(tel), telefone: tel, origem: 'whatsapp', etapa: 'novo', status: 'novo', responsavel_email: perfil.email }).select('id').single();
  if (error) { alert('⚠ Não foi possível criar o lead: ' + error.message); return; }
  await sb.from('lead_eventos').insert({ lead_id: data.id, texto: 'Lead criado a partir de uma conversa do WhatsApp.' });
  await ligarLead(data.id);
}
async function recarregarConversa(id) {
  const { data } = await sb.from('whatsapp_conversas').select('*, leads(nome)').eq('id', id).maybeSingle();
  if (data) { const i = CONVS.findIndex(x => x.id === id); if (i >= 0) CONVS[i] = data; }
  renderLista(); renderChat(false);
}

// ao vivo: mensagem nova, status de entrega/leitura, conversa nova
let recarga = null;
function ouvir() {
  if (canalRT || !sb.channel) return;
  canalRT = sb.channel('wa-conversas')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'whatsapp_mensagens' }, p => {
      const m = p.new || {};
      if (m.conversa_id === aberta) {
        const j = MSGS.findIndex(x => x.id === m.id);
        if (j >= 0) MSGS[j] = { ...MSGS[j], ...m };
        else if (!MSGS.some(x => String(x.id).startsWith('tmp') && x.texto === m.texto && m.direcao === 'saida')) MSGS.push(m);
        renderChat(false);
        if (m.direcao === 'entrada') sb.from('whatsapp_conversas').update({ nao_lidas: 0 }).eq('id', aberta);
        else if (AGENDADAS.length) carregarAgendadas(aberta).then(mudou => { if (mudou) renderChat(false); });   // saiu uma agendada
      }
      if (p.eventType === 'INSERT') ULT[m.conversa_id] = m;
      agendarRecarga();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'whatsapp_conversas' }, () => agendarRecarga())
    .subscribe();
}
function agendarRecarga() {
  clearTimeout(recarga);
  recarga = setTimeout(async () => {
    const { data } = await sb.from('whatsapp_conversas').select('*, leads(nome)').order('ultima_msg_em', { ascending: false, nullsFirst: false }).limit(500);
    if (data) { CONVS = data; const c = CONVS.find(x => x.id === aberta); if (c && c.nao_lidas) c.nao_lidas = 0; }
    renderLista();
    if (aberta && AGENDADAS.length && !painelAgendar && await carregarAgendadas(aberta)) renderChat(false);
  }, 400);
}
// se o Realtime cair (rede do celular), confere a cada 30 s
setInterval(() => { if (perfil && document.visibilityState === 'visible') agendarRecarga(); }, 30000);

iniciar();
</script>
