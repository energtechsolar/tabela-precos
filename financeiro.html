<!DOCTYPE html>
<html lang="pt-BR">
<head>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --amarelo:#FFC107; --amarelo-dim:#e6ac00; --preto:#111; --bg:#0f0f0f; --card:#1a1a1a; --card2:#222;
    --borda:#2e2e2e; --texto:#e0e0e0; --muted:#8a8a8a; --verde:#4ade80; --vermelho:#f87171; --azul:#60a5fa; --laranja:#fb923c;
  }
  body { background:var(--bg); font-family:'Barlow',sans-serif; color:var(--texto); min-height:100vh; padding-bottom:60px; }
  a { color:var(--azul); }
  .header { background:var(--amarelo); padding:16px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .logo-area { display:flex; align-items:center; gap:12px; }
  .logo-icon { width:42px; height:42px; background:var(--preto); border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .brand-name { font-family:'Barlow Condensed',sans-serif; font-size:24px; font-weight:900; color:var(--preto); line-height:1; }
  .brand-sub { font-size:10px; font-weight:600; color:var(--preto); letter-spacing:.2em; text-transform:uppercase; opacity:.6; }
  .header-title { text-align:right; }
  .header-title h1 { font-family:'Barlow Condensed',sans-serif; font-size:17px; font-weight:700; color:var(--preto); text-transform:uppercase; letter-spacing:.05em; }
  .header-links { font-size:12px; color:var(--preto); margin-top:3px; }
  .header-links a { color:var(--preto); font-weight:700; }
  .page { max-width:1200px; margin:0 auto; padding:20px 16px; }
  .card { background:var(--card); border:1px solid var(--borda); border-radius:14px; padding:18px; margin-bottom:16px; }
  .card h2 { font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; color:var(--amarelo); margin-bottom:12px; }
  .muted { color:var(--muted); font-size:13px; }
  .login { max-width:360px; margin:40px auto; text-align:center; }
  .input, .select { background:var(--card2); border:1px solid var(--borda); color:var(--texto); font-family:'Barlow',sans-serif; font-size:14px; padding:8px 10px; border-radius:8px; outline:none; width:100%; }
  .input:focus, .select:focus { border-color:var(--amarelo); }
  .login .input { margin-bottom:10px; }
  .btn { background:var(--amarelo); color:var(--preto); font-family:'Barlow Condensed',sans-serif; font-size:15px; font-weight:900; letter-spacing:.05em; padding:8px 14px; border:none; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .btn:hover { background:var(--amarelo-dim); }
  .btn-sec { background:var(--card2); color:var(--texto); border:1px solid var(--borda); }
  .btn-verde { background:#166534; color:#fff; }
  .btn-p { padding:3px 9px; font-size:12px; }
  .erro { color:var(--vermelho); font-size:13px; margin-top:8px; min-height:16px; }
  #conteudo { display:none; }
  .abas { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center; }
  .aba { background:var(--card2); border:1px solid var(--borda); color:var(--texto); border-radius:20px; padding:8px 14px; font-size:14px; cursor:pointer; }
  .aba.ativa { border-color:var(--amarelo); color:var(--amarelo); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; margin-bottom:16px; }
  .kpi { background:var(--card); border:1px solid var(--borda); border-radius:12px; padding:14px; }
  .kpi-val { font-family:'Barlow Condensed',sans-serif; font-size:24px; font-weight:900; color:var(--amarelo); line-height:1.1; }
  .kpi-lbl { font-size:12px; color:var(--muted); margin-top:3px; }
  .kpi.verm .kpi-val { color:var(--vermelho); } .kpi.verde .kpi-val { color:var(--verde); }
  .tabela-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:7px 8px; border-bottom:1px solid var(--borda); white-space:nowrap; }
  td { padding:8px; border-bottom:1px solid #242424; vertical-align:middle; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr.atraso td:first-child { border-left:3px solid var(--vermelho); }
  .tag { display:inline-block; font-size:11px; padding:1px 7px; border-radius:20px; background:#1a1a1a; border:1px solid var(--borda); color:var(--muted); white-space:nowrap; }
  .tag.atraso { color:var(--vermelho); border-color:#7f1d1d; } .tag.ok { color:var(--verde); border-color:#1f4d33; } .tag.auto { color:var(--azul); border-color:#1e3a5f; }
  .neg { color:var(--vermelho); } .pos { color:var(--verde); }
  .vazio { text-align:center; color:var(--muted); padding:18px 0; font-size:13px; }
  .linha-topo { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .linha-topo h2 { margin-bottom:0; }
  .barras { display:flex; gap:8px; align-items:flex-end; height:170px; padding:8px 0; overflow-x:auto; }
  .barra-mes { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:52px; flex:1; }
  .barra-par { display:flex; gap:3px; align-items:flex-end; height:130px; }
  .barra-par div { width:16px; border-radius:3px 3px 0 0; }
  .b-ent { background:var(--verde); } .b-sai { background:var(--vermelho); }
  .barra-mes span { font-size:11px; color:var(--muted); }
  .grade2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:16px; }
  .dre td:first-child { color:var(--muted); } .dre tr.total td { font-weight:700; color:var(--texto); border-top:1px solid var(--borda); }
  .status-msg { font-size:12px; min-height:16px; color:var(--verde); } .status-msg.erro { color:var(--vermelho); }
  @media (max-width:640px) { .header-title { text-align:left; } td, th { padding:6px 5px; } }
</style>
</head>
<body>
<div class="header">
  <div class="logo-area">
    <div class="logo-icon"><svg width="26" height="26" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="13" fill="#FFC107"/><path d="M16 3L8 15h7l-3 10 10-13h-7l1-9z" fill="#111"/></svg></div>
    <div><div class="brand-name">Energtech</div><div class="brand-sub">Engenharia Solar</div></div>
  </div>
  <div class="header-title"><h1>Financeiro</h1><div class="header-links" id="header-links"><a href="crm.html">CRM</a></div></div>
</div>

<div class="page">
  <div class="card login" id="login" style="display:none">
    <h2 style="font-family:'Barlow Condensed',sans-serif;color:var(--amarelo)">🔑 Entrar</h2>
    <p class="muted" style="margin-bottom:16px">Use o mesmo login do CRM.</p>
    <input class="input" type="email" id="login-email" placeholder="E-mail" autocomplete="username">
    <input class="input" type="password" id="login-senha" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
    <button class="btn" id="login-btn" style="width:100%" onclick="entrar()">Entrar</button>
    <div class="erro" id="login-erro"></div>
  </div>
  <div class="card" id="aviso" style="display:none"><p id="aviso-txt" class="muted"></p></div>

  <div id="conteudo">
    <div class="abas">
      <button class="aba ativa" data-aba="fluxo" onclick="trocarAba('fluxo')">📅 Contas do mês</button>
      <button class="aba" data-aba="hist" onclick="trocarAba('hist')">📁 Pagas e recebidas</button>
      <button class="aba" data-aba="saude" onclick="trocarAba('saude')">📈 Saúde financeira</button>
      <button class="aba" data-aba="obras" onclick="trocarAba('obras')">🏗 Lucro por obra</button>
      <button class="aba" data-aba="fixos" onclick="trocarAba('fixos')">🏢 Custos fixos</button>
      <button class="aba" data-aba="param" onclick="trocarAba('param')">⚙ Parâmetros</button>
      <span style="flex:1"></span>
      <label class="muted">Mês <input class="input" type="month" id="f-mes" style="width:auto;display:inline-block" onchange="carregar()"></label>
      <button class="btn btn-sec" onclick="carregar()" title="Atualizar">🔄</button>
    </div>
    <div class="status-msg" id="msg"></div>
    <div id="aba-fluxo"></div>
    <div id="aba-hist" style="display:none"></div>
    <div id="aba-saude" style="display:none"></div>
    <div id="aba-obras" style="display:none"></div>
    <div id="aba-fixos" style="display:none"></div>
    <div id="aba-param" style="display:none"></div>
  </div>
</div>

<script src="js/comum.js?v=20261019a"></script>
<script src="js/parcelas.js?v=20261103a"></script>
<script src="js/modulos.js?v=20261105a"></script>
<script>
// Energtech — Financeiro (só admin)
// Contas do mês: o que entra (recebimentos) e o que sai (a pagar). O "a pagar" automático (kit ao fornecedor,
// comissão, Simples sobre serviços, salários, diárias e custos fixos) é gerado pela função financeiro_sincronizar.
// Saúde financeira: caixa real (o que entrou e saiu) dos últimos 12 meses + resultado do mês por competência.
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtR = v => (+v || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const fmtR0 = v => (+v || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });
const dBR = iso => iso ? iso.slice(0, 10).split('-').reverse().join('/') : '—';
const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const ultimoDia = ym => { const [a, m] = ym.split('-').map(Number); return ym + '-' + String(new Date(a, m, 0).getDate()).padStart(2, '0'); };
const somaMes = (ym, n) => { const [a, m] = ym.split('-').map(Number); const d = new Date(a, m - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const nomeMes = ym => { const [a, m] = ym.split('-').map(Number); return new Date(a, m - 1, 1).toLocaleDateString('pt-BR', { month:'short' }).replace('.', '') + '/' + String(a).slice(2); };
function numBR(t) { let s = String(t ?? '').replace(/[R$\s]/g, ''); if (!s) return null; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = Number(s); return isFinite(n) ? Math.round(n * 100) / 100 : null; }
const TIPOS_PAG = { kit:'Kit ao fornecedor', comissao:'Comissão', indicacao:'Comissão de indicação', imposto:'Imposto (Simples)', salario:'Salário', diarias:'Diárias / instalações', instalacao:'Instalação', fixo:'Custo fixo', material:'Compra de material (NF)', outro:'Outro' };
const TIPOS_REC = { entrada:'Entrada', boleto:'Boleto', banco:'Banco / financiamento', repasse:'Repasse do fornecedor', outro:'Outro' };
const CATEGORIAS = { aluguel:'Aluguel', energia_agua:'Energia / água', internet_telefone:'Internet / telefone', marketing:'Marketing / anúncios', contador:'Contador', software:'Sistemas / software', veiculo:'Veículo / combustível', prolabore:'Pró-labore', emprestimo:'Empréstimo / financiamento', outros:'Outros' };
let perfil = null, aba = 'fluxo', REC = [], PAG = [], FIXOS = [], PRM = {}, GANHOS = [], verTodas = false, formNovo = false;
let LANC = [], SAIDAS = [], obrasSoMes = false, obraAberta = null, PROJS = {}, histTodos = false;

function msg(t, erro) { const m = $('msg'); m.textContent = t || ''; m.classList.toggle('erro', !!erro); }
function mostrar(qual, texto) {
  $('login').style.display = qual === 'login' ? '' : 'none';
  $('aviso').style.display = qual === 'aviso' ? '' : 'none';
  $('conteudo').style.display = qual === 'conteudo' ? 'block' : 'none';
  if (texto) $('aviso-txt').innerHTML = texto;
}
function renderHeader() {
  let h = '<a href="crm.html">🗂 CRM</a> · <a href="estoque.html">📦 Estoque</a> · <a href="painel.html">📊 Orçamentos</a> · <a href="./">📄 Precificador</a>';
  if (perfil) h += ` · 👤 ${esc(perfil.nome || perfil.email)} · <a href="#" onclick="sair();return false">Sair</a>`;
  $('header-links').innerHTML = h;
}
async function iniciar() {
  if (!sb) { mostrar('aviso', '⚠ Sem conexão com o servidor.'); return; }
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) { perfil = null; renderHeader(); mostrar('login'); return; }
  const r = await sb.rpc('meu_perfil'); perfil = r.data || {};
  renderHeader();
  if (!perfil.admin) { mostrar('aviso', 'O Financeiro é só para o administrador.'); return; }
  mostrar('conteudo');
  if (!$('f-mes').value) $('f-mes').value = hojeISO().slice(0, 7);
  await carregar();
}
async function entrar() {
  const email = $('login-email').value.trim(), senha = $('login-senha').value;
  $('login-erro').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  if (error) { $('login-erro').textContent = 'E-mail ou senha incorretos.'; return; }
  await iniciar();
}
async function sair() { await sb.auth.signOut(); perfil = null; await iniciar(); }
function trocarAba(a) {
  aba = a;
  document.querySelectorAll('.aba').forEach(b => b.classList.toggle('ativa', b.dataset.aba === a));
  ['fluxo', 'hist', 'saude', 'obras', 'fixos', 'param'].forEach(k => $('aba-' + k).style.display = k === a ? '' : 'none');
  render();
}

async function carregar() {
  const ym = $('f-mes').value || hojeISO().slice(0, 7);
  msg('⏳ Atualizando…');
  const s = await sb.rpc('financeiro_sincronizar', { p_mes: ym + '-01' });
  if (s.error) { msg('⚠ ' + s.error.message, true); return; }
  // o mês atual também (salários e custos fixos do mês corrente), se estiver olhando outro mês
  if (ym !== hojeISO().slice(0, 7)) await sb.rpc('financeiro_sincronizar', { p_mes: hojeISO() });
  const [r, p, f, prm, g, la, sa, pjs] = await Promise.all([
    sb.from('recebimentos').select('*, leads(nome)').limit(5000),
    sb.from('pagamentos').select('*, leads(nome), equipe(nome)').limit(10000),
    sb.from('custos_fixos').select('*').order('nome'),
    sb.from('fin_parametros').select('*').eq('id', 1).maybeSingle(),
    sb.from('leads').select('id, nome, etapa_em, forma_pagamento, orcamento_ganho_id, vendedor_id').eq('etapa', 'ganho').limit(5000),
    // custos de cada obra que não passam por "pagamentos" com o cliente: diárias da equipe e material tirado do estoque
    sb.from('equipe_lancamentos').select('lead_id, data, tipo, quantidade, valor, equipe(nome)').not('lead_id', 'is', null).limit(10000),
    sb.from('estoque_movimentos').select('lead_id, data, quantidade, custo_unit, produtos(nome)').eq('tipo', 'saida').not('lead_id', 'is', null).limit(10000),
    sb.from('projetos').select('*').neq('etapa', 'cancelado').limit(5000),   // kit pago pelo banco (vendas financiadas)
  ]);
  const err = [r, p, f, prm, g, la, sa].find(x => x.error);
  if (err) { msg('⚠ ' + err.error.message, true); return; }
  REC = r.data || []; PAG = p.data || []; FIXOS = f.data || []; PRM = prm.data || {}; GANHOS = g.data || [];
  LANC = la.data || []; SAIDAS = sa.data || [];
  PROJS = {}; ((pjs && !pjs.error && pjs.data) || []).forEach(x => { PROJS[x.lead_id] = x; });
  const ids = GANHOS.map(l => l.orcamento_ganho_id).filter(Boolean);
  if (ids.length) {
    const [o, c] = await Promise.all([
      sb.from('orcamentos').select('id, lead_id, valor_final, modo_valor:dados->>modo_valor, valor_kit:dados->>valor_kit, repasse_pct:dados->>repasse_pct').in('id', ids),
      sb.from('orcamento_custos').select('orcamento_id, custo_kit').in('orcamento_id', ids),
    ]);
    const mapa = Object.fromEntries((o.data || []).map(x => [x.id, x])), custos = Object.fromEntries((c.data || []).map(x => [x.orcamento_id, x.custo_kit]));
    GANHOS.forEach(l => {
      const x = mapa[l.orcamento_ganho_id] || {};
      l.valor = +x.valor_final || 0;
      l.custo = custos[l.orcamento_ganho_id] != null ? +custos[l.orcamento_ganho_id] : null;
      // nota de repasse (kit na proposta acima do custo): o imposto dela sai da margem
      const kit = x.modo_valor === 'separado' ? +x.valor_kit || 0 : 0;
      const rep = kit && l.custo != null ? Math.max(0, kit - l.custo) : 0;
      l.impRepasse = Math.round(rep * (x.repasse_pct != null && x.repasse_pct !== '' ? +x.repasse_pct : 4)) / 100;
      l.financ = /financ|finame|banco|bndes|caixa/i.test(l.forma_pagamento || '');
    });
  }
  msg('');
  render();
}
function render() { if (aba === 'fluxo') renderFluxo(); else if (aba === 'hist') renderHist(); else if (aba === 'saude') renderSaude(); else if (aba === 'obras') renderObras(); else if (aba === 'fixos') renderFixos(); else renderParam(); }

// comissões: do vendedor ("comissao") e de quem indicou o cliente ("indicacao")
const TIPOS_COM = ['comissao', 'indicacao'];
const ehCom = t => TIPOS_COM.includes(t);
// ── comissão: liberada conforme o cliente paga (parcelas do cliente/banco recebidas ÷ total das parcelas) ──
function fracaoRecebida(leadId) {
  const ps = REC.filter(x => x.lead_id === leadId && x.tipo !== 'repasse');
  const tot = ps.reduce((a, x) => a + (+x.valor || 0), 0);
  const rec = ps.filter(x => x.recebido_em).reduce((a, x) => a + (+(x.valor_recebido ?? x.valor) || 0), 0);
  return tot > 0 ? Math.min(1, rec / tot) : 0;
}
function comissoes() {
  return PAG.filter(p => p.auto && ehCom(p.tipo)).map(p => {
    const pago = PAG.filter(x => !x.auto && x.tipo === p.tipo && x.lead_id === p.lead_id && x.pago_em).reduce((a, x) => a + (+x.valor || 0), 0);
    const fr = fracaoRecebida(p.lead_id), liberada = Math.round(+p.valor * fr * 100) / 100;
    return { ...p, pago, fr, liberada, agora: Math.max(0, Math.round((liberada - pago) * 100) / 100), resta: Math.max(0, Math.round((+p.valor - pago) * 100) / 100) };
  });
}
const nomeCli = x => (x.leads && x.leads.nome) || '';
const linkCli = x => x.lead_id ? `<a href="crm.html?lead=${x.lead_id}">${esc(nomeCli(x) || 'cliente')}</a>` : '';

function renderFluxo() {
  const ym = $('f-mes').value, ini = ym + '-01', fim = ultimoDia(ym), hoje = hojeISO();
  const noMes = d => d && d >= ini && d <= fim;
  // a receber: não recebidos até o fim do mês (inclui atrasados) e sem data
  const aReceber = REC.filter(x => !x.recebido_em && (verTodas || !x.vencimento || x.vencimento <= fim)).sort((a, b) => (a.vencimento || '9') < (b.vencimento || '9') ? -1 : 1);
  const recebidos = REC.filter(x => noMes(x.recebido_em));
  const atrasadoRec = REC.filter(x => !x.recebido_em && x.vencimento && x.vencimento < hoje).reduce((a, x) => a + +x.valor, 0);
  const somaRecMes = REC.filter(x => !x.recebido_em && noMes(x.vencimento)).reduce((a, x) => a + +x.valor, 0);
  const recebidoMes = recebidos.reduce((a, x) => a + +(x.valor_recebido ?? x.valor), 0);
  const coms = comissoes();
  const aPagar = PAG.filter(x => !x.pago_em && !(x.auto && ehCom(x.tipo)) && (verTodas || !x.vencimento || x.vencimento <= fim)).sort((a, b) => (a.vencimento || '9') < (b.vencimento || '9') ? -1 : 1);
  const pagos = PAG.filter(x => noMes(x.pago_em) && !(x.auto && ehCom(x.tipo)));
  const comAgora = coms.reduce((a, c) => a + c.agora, 0);
  const somaPagMes = aPagar.filter(x => !x.vencimento || x.vencimento <= fim).reduce((a, x) => a + +x.valor, 0) + comAgora;
  const pagoMes = pagos.reduce((a, x) => a + +x.valor, 0);
  const saldo = recebidoMes + somaRecMes - pagoMes - somaPagMes;
  const kp = (v, t, cls) => `<div class="kpi ${cls || ''}"><div class="kpi-val">${v}</div><div class="kpi-lbl">${t}</div></div>`;
  const stRec = x => x.vencimento && x.vencimento < hoje ? `<span class="tag atraso">atrasado</span>` : (x.vencimento ? '' : '<span class="tag">sem data</span>');

async function desfazerRec(id) {
  const x = REC.find(r => r.id === id); if (!x || !confirm('Desfazer o recebimento de ' + fmtR(x.valor_recebido ?? x.valor) + '? (volta para "A receber")')) return;
  const { error } = await sb.from('recebimentos').update({ recebido_em: null, valor_recebido: null }).eq('id', id);
  if (error) { msg('⚠ ' + error.message, true); return; }
  x.recebido_em = null; x.valor_recebido = null; msg('↺ Recebimento desfeito.'); render();
}
// financiadas com o valor do kit pago pelo banco: confere kit + liberação = proposta (o que conta é o valor final)
function conferenciaFinanciadas() {
  return GANHOS.filter(l => l.financ && PROJS[l.id] && PROJS[l.id].kit_pago_valor != null).map(l => {
    const kit = +PROJS[l.id].kit_pago_valor, esperado = Math.round(((+l.valor || 0) - kit) * 100) / 100;
    const bancos = REC.filter(x => x.lead_id === l.id && x.tipo === 'banco');
    const lancado = bancos.reduce((a, x) => a + (+x.valor || 0), 0);
    const recebidos = bancos.filter(x => x.recebido_em);
    const recebido = recebidos.length === bancos.length && bancos.length ? recebidos.reduce((a, x) => a + +(x.valor_recebido ?? x.valor), 0) : null;
    const dif = Math.round((esperado - (recebido != null ? recebido : lancado)) * 100) / 100;
    return { l, kit, esperado, lancado, recebido, dif, ajustavel: recebido == null && bancos.filter(x => !x.recebido_em).length === 1 };
  }).filter(c => c.recebido == null && Math.abs(c.dif) > 0.5);   // depois de recebido, a diferença aparece no Lucro por obra
}
async function ajustarLiberacao(leadId, esperado) {
  const abertos = REC.filter(x => x.lead_id === leadId && x.tipo === 'banco' && !x.recebido_em);
  if (abertos.length !== 1) return;
  const outros = REC.filter(x => x.lead_id === leadId && x.tipo === 'banco' && x.recebido_em).reduce((a, x) => a + +(x.valor_recebido ?? x.valor), 0);
  const novo = Math.round((esperado - outros) * 100) / 100;
  if (!confirm('Ajustar a liberação do banco a receber de ' + fmtR(abertos[0].valor) + ' para ' + fmtR(novo) + '?')) return;
  const { error } = await sb.from('recebimentos').update({ valor: novo }).eq('id', abertos[0].id);
  if (error) { msg('⚠ ' + error.message, true); return; }
  abertos[0].valor = novo; msg('✅ Liberação do banco ajustada para ' + fmtR(novo) + '.'); render();
}
// gera as parcelas a receber de uma venda pela condição salva na proposta (mesma regra do CRM)
async function gerarParcelas(leadId) {
  const l = GANHOS.find(x => x.id === leadId); if (!l) return;
  if (!l.orcamento_ganho_id) { msg('⚠ Marque no CRM qual proposta fechou (bloco Negócio ganho → alterar).', true); return; }
  msg('⏳ Gerando parcelas…');
  const r = await parcelasDaVenda({ leadId, orcamentoId: l.orcamento_ganho_id, forma: l.forma_pagamento, valorFinal: l.valor,
    perguntarN: () => Math.max(0, Math.min(24, parseInt(prompt('Em quantos boletos fica o restante (depois da entrada no valor do kit)?', '3'), 10) || 0)) });
  if (r.erro) { msg('⚠ ' + r.erro, true); return; }
  if (r.cancelado || !r.novas.length) { msg(''); return; }
  const resumo = r.novas.map(x => '• ' + x.descricao + ': ' + fmtR(x.valor) + (x.vencimento ? ' em ' + dBR(x.vencimento) : ' (sem data)')).join('\n');
  if (!confirm('Parcelas de ' + l.nome + ':\n\n' + resumo + '\n\nLançar? (dá para ajustar valores e datas depois, na ficha do cliente no CRM)')) { msg(''); return; }
  const { error } = await sb.from('recebimentos').insert(r.novas);
  if (error) { msg('⚠ ' + error.message, true); return; }
  await carregar(); msg('✅ Parcelas de ' + l.nome + ' lançadas.' + (r.aviso ? ' ⚠ ' + r.aviso : ''), !!r.aviso);
}
const editavel = x => !x.auto || ['fixo', 'salario', 'diarias', 'instalacao', 'outro'].includes(x.tipo);

async function receber(id) {
  const x = REC.find(r => r.id === id); if (!x) return;
  const d = prompt('Data do recebimento (DD/MM/AAAA):', dBR(hojeISO())); if (!d) return;
  const iso = paraISO(d); if (!iso) { msg('⚠ Data inválida.', true); return; }
  // valor que entrou de fato (banco pode descontar taxa/IOF): a diferença vira custo da obra no Lucro por obra
  const vt = prompt('Valor que entrou na conta (R$):', (+x.valor).toLocaleString('pt-BR', { minimumFractionDigits: 2 })); if (vt === null) return;
  const v = numBR(vt);
  if (v === null || v < 0) { msg('⚠ Valor inválido.', true); return; }
  const { error } = await sb.from('recebimentos').update({ recebido_em: iso, valor_recebido: v }).eq('id', id);
  if (error) { msg('⚠ ' + error.message, true); return; }
  x.recebido_em = iso; x.valor_recebido = v;
  const dif = Math.round((+x.valor - v) * 100) / 100;
  msg(Math.abs(dif) > 0.004 ? '✅ Recebimento registrado. ⚠ Entrou ' + fmtR(Math.abs(dif)) + (dif > 0 ? ' a menos' : ' a mais') + ' que o previsto' + (dif > 0 ? ' (entra como custo da obra no Lucro por obra).' : '.') : '✅ Recebimento registrado.', Math.abs(dif) > 0.004);
  render();
}
function paraISO(t) { const m = String(t || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (!m) return null; return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0'); }
async function pagar(id) {

  const d = prompt('Data do pagamento de ' + fmtR(x.valor) + ' (DD/MM/AAAA):', dBR(hojeISO())); if (!d) return;
  const iso = paraISO(d); if (!iso) { msg('⚠ Data inválida.', true); return; }

}
async function desfazerPag(id) {
  const x = PAG.find(p => p.id === id); if (!x || !confirm('Desfazer o pagamento de ' + fmtR(x.valor) + '?')) return;
  if (!x.auto && ehCom(x.tipo)) {   // pagamento de comissão é um lançamento próprio: apaga
    const { error } = await sb.from('pagamentos').delete().eq('id', id); if (error) { msg('⚠ ' + error.message, true); return; }
    PAG = PAG.filter(p => p.id !== id);
    const mae = PAG.find(p => p.auto && p.tipo === x.tipo && p.lead_id === x.lead_id && p.pago_em);
    if (mae) { await sb.from('pagamentos').update({ pago_em: null }).eq('id', mae.id); mae.pago_em = null; }
  } else {
    const { error } = await sb.from('pagamentos').update({ pago_em: null }).eq('id', id); if (error) { msg('⚠ ' + error.message, true); return; }
    x.pago_em = null;
  }
  render();
}
async function pagarComissao(id) {

// lançamento avulso: pode ser ligado a um cliente/obra (ex.: cimento, areia e brita da instalação do Angelo)

function formNovoPag() {
  const obras = GANHOS.slice().sort((a, b) => (b.etapa_em || '') < (a.etapa_em || '') ? -1 : 1);
  return `<div style="background:var(--card2);border:1px solid var(--borda);border-radius:10px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;align-items:end">
    <label class="muted">Cliente / obra (opcional)<select class="select" id="np-lead"><option value="">— despesa geral da empresa —</option>${obras.map(l => `<option value="${l.id}">${esc(l.nome)}</option>`).join('')}</select></label>
    <label class="muted">Tipo<select class="select" id="np-cat">${CATS_AVULSO.map(c => `<option>${c}</option>`).join('')}</select></label>
    <label class="muted">Descrição<input class="input" id="np-desc" placeholder="Ex.: cimento, areia e brita"></label>
    <label class="muted">Valor (R$)<input class="input" id="np-valor" inputmode="decimal" placeholder="563,90"></label>
    <label class="muted">Vencimento<input class="input" type="date" id="np-venc" value="${hojeISO()}"></label>
    <label class="muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="np-pago" checked> Já foi pago</label>
    <button class="btn" onclick="salvarNovoPag()">💾 Lançar</button>
  </div>`;
}
async function salvarNovoPag() {
  const lead = +$('np-lead').value || null, cat = $('np-cat').value, desc = $('np-desc').value.trim(), v = numBR($('np-valor').value), venc = $('np-venc').value;
  if (!v || v <= 0) { msg('⚠ Informe o valor.', true); return; }
  if (!venc) { msg('⚠ Informe o vencimento.', true); return; }
  const reg = { tipo: 'outro', descricao: cat + (desc ? ': ' + desc : ''), valor: v, vencimento: venc, competencia: venc.slice(0, 8) + '01', lead_id: lead, pago_em: $('np-pago').checked ? hojeISO() : null };
  const { data, error } = await sb.from('pagamentos').insert(reg).select('*, leads(nome), equipe(nome)').single();
  if (error) { msg('⚠ ' + error.message, true); return; }
  PAG.push(data); formNovo = false; render();
  msg('✅ Lançado' + (lead ? ' na obra de ' + ((data.leads || {}).nome || 'cliente') : '') + ': ' + fmtR(v) + (reg.pago_em ? ' (pago hoje)' : ' (a pagar)') + '.');
}
async function novoPagamento() {
  const desc = prompt('Descrição da saída (ex.: manutenção do carro, material elétrico extra):'); if (!desc) return;
  const v = numBR(prompt('Valor (R$):')); if (!v) return;
  const d = prompt('Vencimento (DD/MM/AAAA):', dBR(hojeISO())); const iso = paraISO(d); if (!iso) { msg('⚠ Data inválida.', true); return; }
  const pagoJa = confirm('Já foi pago? (OK = já pago hoje · Cancelar = fica a pagar)');
  const { data, error } = await sb.from('pagamentos').insert({ tipo: 'outro', descricao: desc, valor: v, vencimento: iso, competencia: iso.slice(0, 8) + '01', pago_em: pagoJa ? hojeISO() : null }).select('*, leads(nome), equipe(nome)').single();
  if (error) { msg('⚠ ' + error.message, true); return; }
  PAG.push(data); render();
}

// ── saúde financeira ──
function renderSaude() {
  const ym = $('f-mes').value, meses = Array.from({ length: 12 }, (_, i) => somaMes(ym, i - 11));
  const grupo = t => ({ kit:'kit', comissao:'comissao', indicacao:'comissao', imposto:'imposto', salario:'equipe', diarias:'equipe', instalacao:'equipe', fixo:'fixo', outro:'outro' }[t] || 'outro');
  const caixa = meses.map(m => {
    const ini = m + '-01', fim = ultimoDia(m), em = d => d && d >= ini && d <= fim;
    const ent = REC.filter(x => em(x.recebido_em)).reduce((a, x) => a + +(x.valor_recebido ?? x.valor), 0);
    const sai = { kit: 0, comissao: 0, imposto: 0, equipe: 0, fixo: 0, outro: 0 };
    PAG.filter(x => em(x.pago_em) && !(x.auto && ehCom(x.tipo))).forEach(x => { sai[grupo(x.tipo)] += +x.valor; });
    const tot = Object.values(sai).reduce((a, b) => a + b, 0);
    return { m, ent, sai, tot, res: ent - tot };
  });
  let acum = 0; caixa.forEach(c => { acum += c.res; c.acum = acum; });
  const max = Math.max(1, ...caixa.map(c => Math.max(c.ent, c.tot)));
  // competência do mês: vendas fechadas e o que elas custam; custos fixos e equipe do mês
  const ini = ym + '-01', fim = ultimoDia(ym);
  const vendas = GANHOS.filter(l => l.etapa_em && l.etapa_em.slice(0, 10) >= ini && l.etapa_em.slice(0, 10) <= fim);
  const fat = vendas.reduce((a, l) => a + (+l.valor || 0), 0), idsV = new Set(vendas.map(l => l.id));
  const daVenda = t => PAG.filter(x => x.auto && x.tipo === t && idsV.has(x.lead_id)).reduce((a, x) => a + +x.valor, 0);
  // custo do kit de todas as vendas (nas financiadas o banco paga o fornecedor, mas é custo da venda do mesmo jeito)
  const custoKit = vendas.reduce((a, l) => a + (l.custo || 0), 0), com = daVenda('comissao') + daVenda('indicacao'), imp = daVenda('imposto');
  const impRep = vendas.reduce((a, l) => a + (l.impRepasse || 0), 0);
  const financ = vendas.filter(l => l.financ), semCusto = vendas.filter(l => l.custo == null);
  const kitBanco = (financ.length ? `<tr><td colspan="2" class="muted" style="font-size:12px">↳ ${financ.length} financiada(s): kit pago pelo banco direto ao fornecedor (é custo da venda, mas não sai do caixa da Energtech).</td></tr>` : '')
    + (semCusto.length ? `<tr><td colspan="2" style="font-size:12px;color:var(--amarelo)">⚠ Sem custo do kit registrado: ${semCusto.map(l => esc(l.nome)).join(', ')}</td></tr>` : '');
  const margemC = fat - custoKit - com - imp - impRep;
  const compM = t => PAG.filter(x => x.competencia === ini && t.includes(x.tipo) && !x.lead_id).reduce((a, x) => a + +x.valor, 0);
  const fixosMes = compM(['fixo']), equipeMes = compM(['salario', 'diarias', 'instalacao']), outrosMes = PAG.filter(x => x.tipo === 'outro' && x.competencia === ini).reduce((a, x) => a + +x.valor, 0);
  const resultado = margemC - fixosMes - equipeMes - outrosMes;
  // ponto de equilíbrio: custos do mês ÷ margem de contribuição média (últimos 3 meses com venda)
  const ult3 = [0, 1, 2].map(i => somaMes(ym, -i)).map(m => {
    const v = GANHOS.filter(l => l.etapa_em && l.etapa_em.slice(0, 7) === m), ids = new Set(v.map(l => l.id));
    const f = v.reduce((a, l) => a + (+l.valor || 0), 0), c = v.reduce((a, l) => a + (l.custo || 0) + (l.impRepasse || 0), 0) + PAG.filter(x => x.auto && ['comissao', 'indicacao', 'imposto'].includes(x.tipo) && ids.has(x.lead_id)).reduce((a, x) => a + +x.valor, 0);
    return { f, mc: f - c };
  });
  const f3 = ult3.reduce((a, x) => a + x.f, 0), mc3 = ult3.reduce((a, x) => a + x.mc, 0), pctMC = f3 > 0 ? mc3 / f3 : 0;
  const custosMes = fixosMes + equipeMes;
  const equilibrio = pctMC > 0 ? custosMes / pctMC : 0;
  const linha = (t, v, cls) => `<tr class="${cls || ''}"><td>${t}</td><td class="num">${v}</td></tr>`;
  const sinal = v => `<span class="${v < 0 ? 'neg' : 'pos'}">${fmtR(v)}</span>`;
  const c12 = caixa.slice(-3), media3 = c12.reduce((a, c) => a + c.res, 0) / 3;
  $('aba-saude').innerHTML = `
    <div class="kpis">
      <div class="kpi ${caixa[11].res < 0 ? 'verm' : 'verde'}"><div class="kpi-val">${fmtR0(caixa[11].res)}</div><div class="kpi-lbl">Caixa de ${nomeMes(ym)} (entrou − saiu)</div></div>
      <div class="kpi ${media3 < 0 ? 'verm' : 'verde'}"><div class="kpi-val">${fmtR0(media3)}</div><div class="kpi-lbl">Média de caixa dos últimos 3 meses</div></div>
      <div class="kpi ${resultado < 0 ? 'verm' : 'verde'}"><div class="kpi-val">${fmtR0(resultado)}</div><div class="kpi-lbl">Resultado de ${nomeMes(ym)} (vendas do mês − custos)</div></div>
      <div class="kpi"><div class="kpi-val">${pctMC ? fmtR0(equilibrio) : '—'}</div><div class="kpi-lbl">Ponto de equilíbrio: vendas necessárias por mês para cobrir fixos + equipe${pctMC ? ' (margem média ' + Math.round(pctMC * 100) + '%)' : ''}</div></div>
    </div>
    <div class="grade2">
      <div class="card"><h2>📊 Resultado de ${nomeMes(ym)} (competência)</h2>
        <table class="dre"><tbody>
          ${linha('Vendas fechadas (' + vendas.length + ')', fmtR(fat))}
          ${linha('(−) Kits ao fornecedor (custo fechado)', fmtR(custoKit))}
          ${kitBanco}
          ${linha('(−) Comissões', fmtR(com))}
          ${linha('(−) Simples ' + String(PRM.simples_pct ?? 6).replace('.', ',') + '% sobre serviços', fmtR(imp))}
          ${impRep ? linha('(−) Imposto das notas de repasse', fmtR(impRep)) : ''}
          ${linha('= Margem de contribuição', sinal(margemC), 'total')}
          ${linha('(−) Custos fixos', fmtR(fixosMes))}
          ${linha('(−) Equipe (salários, diárias, instalações)', fmtR(equipeMes))}
          ${linha('(−) Outras saídas', fmtR(outrosMes))}
          ${linha('= Resultado do mês', sinal(resultado), 'total')}
        </tbody></table>
        <p class="muted" style="margin-top:8px">Competência: considera as vendas fechadas no mês e os custos daquele mês, mesmo que ainda não tenham sido pagos ou recebidos.</p>
      </div>
      <div class="card"><h2>💵 Caixa real — últimos 12 meses</h2>
        <div class="barras">${caixa.map(c => `<div class="barra-mes" title="${nomeMes(c.m)}: entrou ${fmtR(c.ent)} · saiu ${fmtR(c.tot)}"><div class="barra-par"><div class="b-ent" style="height:${Math.round(c.ent / max * 125)}px"></div><div class="b-sai" style="height:${Math.round(c.tot / max * 125)}px"></div></div><span>${nomeMes(c.m)}</span></div>`).join('')}</div>
        <p class="muted"><span style="color:var(--verde)">■</span> entrou &nbsp; <span style="color:var(--vermelho)">■</span> saiu &nbsp;· só o que foi marcado como recebido / pago</p>
      </div>
    </div>
    <div class="card"><h2>📒 Caixa mês a mês</h2><div class="tabela-wrap"><table>
      <thead><tr><th>Mês</th><th class="num">Entrou</th><th class="num">Kits</th><th class="num">Comissões</th><th class="num">Impostos</th><th class="num">Equipe</th><th class="num">Fixos</th><th class="num">Outros</th><th class="num">Resultado</th><th class="num">Acumulado</th></tr></thead>
      <tbody>${caixa.slice().reverse().map(c => `<tr><td>${nomeMes(c.m)}</td><td class="num pos">${fmtR0(c.ent)}</td><td class="num">${fmtR0(c.sai.kit)}</td><td class="num">${fmtR0(c.sai.comissao)}</td><td class="num">${fmtR0(c.sai.imposto)}</td><td class="num">${fmtR0(c.sai.equipe)}</td><td class="num">${fmtR0(c.sai.fixo)}</td><td class="num">${fmtR0(c.sai.outro)}</td><td class="num"><b class="${c.res < 0 ? 'neg' : 'pos'}">${fmtR0(c.res)}</b></td><td class="num ${c.acum < 0 ? 'neg' : ''}">${fmtR0(c.acum)}</td></tr>`).join('')}</tbody>
    </table></div>
    <p class="muted" style="margin-top:8px">O histórico começa quando os recebimentos e pagamentos passam a ser marcados no sistema. Meses anteriores ficam zerados.</p></div>`;
}

// ── lucro por obra ──
// Venda − kit (custo fechado) − comissão − imposto − equipe (diárias lançadas na obra) − material do estoque − avulsos da obra.
// Salários e custos fixos não são de uma obra só: entram no "após rateio", divididos entre as vendas do mês
// na proporção do valor de cada venda.
const TIPOS_DIRETOS = ['kit', 'comissao', 'indicacao', 'imposto'];
function resultadoObra(l) {
  const pg = PAG.filter(x => x.lead_id === l.id);
  const soma = f => Math.round(pg.filter(f).reduce((a, x) => a + (+x.valor || 0), 0) * 100) / 100;
  const kitPag = soma(x => x.tipo === 'kit');
  const kit = l.custo != null ? l.custo : kitPag;
  const com = soma(x => x.auto && ehCom(x.tipo));
  const imp = soma(x => x.tipo === 'imposto') + (l.impRepasse || 0);
  const lanc = LANC.filter(x => x.lead_id === l.id);
  const equipe = lanc.reduce((a, x) => a + (+x.valor || 0), 0);
  const est = SAIDAS.filter(x => x.lead_id === l.id).map(x => ({ data: x.data, desc: ((x.produtos && x.produtos.nome) || 'Material') + ' × ' + String(+x.quantidade).replace('.', ','), valor: Math.round((+x.quantidade || 0) * (+x.custo_unit || 0) * 100) / 100 }));
  const avulsos = pg.filter(x => !TIPOS_DIRETOS.includes(x.tipo)).map(x => ({ data: x.pago_em || x.vencimento, desc: x.descricao || TIPOS_PAG[x.tipo] || '', valor: +x.valor || 0 }))
    // recebimento que entrou a menos que o previsto (taxa/IOF do banco, desconto): custo da obra
    .concat(REC.filter(x => x.lead_id === l.id && x.recebido_em && x.valor_recebido != null && +x.valor - +x.valor_recebido > 0.004)
      .map(x => ({ data: x.recebido_em, desc: 'Entrou a menos: ' + (TIPOS_REC[x.tipo] || x.tipo) + ' (previsto ' + fmtR(x.valor) + ', entrou ' + fmtR(x.valor_recebido) + ')', valor: Math.round((+x.valor - +x.valor_recebido) * 100) / 100 })));
  const outros = est.concat(avulsos).reduce((a, x) => a + x.valor, 0);
  const custos = kit + com + imp + equipe + outros;
  const lucro = Math.round(((+l.valor || 0) - custos) * 100) / 100;
  // rateio: fixos + salários da competência da venda × (esta venda ÷ vendas do mês)
  const m = (l.etapa_em || '').slice(0, 7);
  const fatMes = GANHOS.filter(x => (x.etapa_em || '').slice(0, 7) === m).reduce((a, x) => a + (+x.valor || 0), 0);
  const estrut = PAG.filter(x => x.competencia === m + '-01' && ['fixo', 'salario'].includes(x.tipo) && !x.lead_id).reduce((a, x) => a + (+x.valor || 0), 0);
  const rateio = fatMes > 0 ? Math.round(estrut * (+l.valor || 0) / fatMes * 100) / 100 : 0;
  const avisos = [];
  if (l.custo == null && !kitPag) avisos.push('sem custo do kit');
  if (!com && !l.vendedor_id) avisos.push('sem comissão lançada (vendedor não informado?)');
  if (!lanc.length) avisos.push('nenhuma diária lançada nesta obra ainda');
  const pjk = PROJS[l.id];
  if (l.financ && pjk && pjk.kit_pago_valor != null) { const dk = Math.round(((+l.valor || 0) - +pjk.kit_pago_valor - REC.filter(x => x.lead_id === l.id && x.tipo === 'banco').reduce((a, x) => a + +(x.recebido_em && x.valor_recebido != null ? x.valor_recebido : x.valor), 0)) * 100) / 100; if (Math.abs(dk) > 0.5) avisos.push('financiamento não fecha com a proposta: diferença ' + fmtR(Math.abs(dk))); }
  return { kit, com, imp, equipe, outros, custos, lucro, rateio, liquido: Math.round((lucro - rateio) * 100) / 100, lanc, est, avulsos, avisos, m };
}
function renderObras() {
  const ym = $('f-mes').value;
  const lista = GANHOS.filter(l => !obrasSoMes || (l.etapa_em || '').slice(0, 7) === ym)
    .map(l => ({ l, r: resultadoObra(l) }))
    .sort((a, b) => (b.l.etapa_em || '') < (a.l.etapa_em || '') ? -1 : 1);
  const tot = k => lista.reduce((a, x) => a + (k === 'valor' ? +x.l.valor || 0 : x.r[k]), 0);
  const pct = (v, base) => base > 0 ? ' <span class="muted">(' + Math.round(v / base * 100) + '%)</span>' : '';
  const sinal = v => `<b class="${v < 0 ? 'neg' : 'pos'}">${fmtR(v)}</b>`;
  const det = ({ l, r }) => {
    const ln = (t, v, cls) => `<tr class="${cls || ''}"><td>${t}</td><td class="num">${v}</td></tr>`;
    const itens = (arr, f) => arr.map(f).join('');
    return `<tr><td colspan="10" style="background:var(--card2)"><div class="grade2">
      <table class="dre"><tbody>
        ${ln('Valor da venda', fmtR(l.valor))}
        ${ln('(−) Kit ao fornecedor' + (l.financ ? ' <span class="muted">(pago pelo banco)</span>' : ''), fmtR(r.kit))}
        ${ln('(−) Comissões (vendedor + indicação)', fmtR(r.com))}
        ${ln('(−) Imposto', fmtR(r.imp))}
        ${ln('(−) Equipe na obra (diárias)', fmtR(r.equipe))}
        ${ln('(−) Materiais e outros custos da obra', fmtR(r.outros))}
        ${ln('= Lucro da obra', sinal(r.lucro), 'total')}
        ${ln('(−) Parte dos fixos + salários de ' + (r.m ? nomeMes(r.m) : '—'), fmtR(r.rateio))}
        ${ln('= Lucro líquido', sinal(r.liquido), 'total')}
      </tbody></table>
      <div>
        <div class="muted" style="margin-bottom:4px"><b>Equipe</b></div>
        ${r.lanc.length ? `<table><tbody>${itens(r.lanc.slice().sort((a, b) => a.data < b.data ? -1 : 1), x => `<tr><td>${dBR(x.data)}</td><td>${esc((x.equipe && x.equipe.nome) || '')} <span class="muted">${x.tipo === 'dia' ? (+x.quantidade === 1 ? '1 dia' : String(+x.quantidade).replace('.', ',') + ' dias') : esc(x.tipo || '')}</span></td><td class="num">${fmtR(x.valor)}</td></tr>`)}</tbody></table>` : '<div class="muted">Nenhuma diária lançada (Equipe → lançar dia na obra).</div>'}
        <div class="muted" style="margin:10px 0 4px"><b>Materiais e outros</b></div>
        ${r.est.length + r.avulsos.length ? `<table><tbody>${itens(r.est.concat(r.avulsos), x => `<tr><td>${dBR(x.data)}</td><td>${esc(x.desc)}</td><td class="num">${fmtR(x.valor)}</td></tr>`)}</tbody></table>` : '<div class="muted">Nada lançado (Contas do mês → A pagar → + Lançamento avulso).</div>'}
        ${r.avisos.length ? `<p style="font-size:12px;color:var(--amarelo);margin-top:8px">⚠ ${r.avisos.map(esc).join(' · ')}</p>` : ''}
      </div></div></td></tr>`;
  };
  const vt = tot('valor'), lt = tot('lucro'), liq = tot('liquido');
  $('aba-obras').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="kpi-val">${fmtR0(vt)}</div><div class="kpi-lbl">Vendas (${lista.length})</div></div>
      <div class="kpi"><div class="kpi-val">${fmtR0(tot('custos'))}</div><div class="kpi-lbl">Custos diretos das obras</div></div>
      <div class="kpi ${lt < 0 ? 'verm' : 'verde'}"><div class="kpi-val">${fmtR0(lt)}</div><div class="kpi-lbl">Lucro das obras${vt > 0 ? ' · ' + Math.round(lt / vt * 100) + '% da venda' : ''}</div></div>
      <div class="kpi ${liq < 0 ? 'verm' : 'verde'}"><div class="kpi-val">${fmtR0(liq)}</div><div class="kpi-lbl">Lucro líquido (após fixos + salários)</div></div>
    </div>
    <div class="card"><div class="linha-topo"><h2>🏗 Lucro por obra</h2>
      <label class="muted"><input type="checkbox" ${obrasSoMes ? 'checked' : ''} onchange="obrasSoMes=this.checked;renderObras()"> Só vendas fechadas em ${nomeMes(ym)}</label></div>
      ${lista.length ? `<div class="tabela-wrap"><table>
        <thead><tr><th>Cliente</th><th>Fechada</th><th class="num">Venda</th><th class="num">Kit</th><th class="num">Comissão</th><th class="num">Imposto</th><th class="num">Equipe</th><th class="num">Materiais/outros</th><th class="num">Lucro da obra</th><th class="num">Lucro líquido</th></tr></thead>
        <tbody>${lista.map(x => `<tr style="cursor:pointer" onclick="obraAberta=obraAberta===${x.l.id}?null:${x.l.id};renderObras()">
          <td>${obraAberta === x.l.id ? '▾' : '▸'} <a href="crm.html?lead=${x.l.id}" onclick="event.stopPropagation()">${esc(x.l.nome)}</a>${x.r.avisos.length ? ' <span title="' + esc(x.r.avisos.join(' · ')) + '" style="color:var(--amarelo)">⚠</span>' : ''}</td>
          <td>${dBR(x.l.etapa_em)}</td><td class="num">${fmtR(x.l.valor)}</td><td class="num">${fmtR(x.r.kit)}</td><td class="num">${fmtR(x.r.com)}</td><td class="num">${fmtR(x.r.imp)}</td>
          <td class="num">${fmtR(x.r.equipe)}</td><td class="num">${fmtR(x.r.outros)}</td><td class="num">${sinal(x.r.lucro)}${pct(x.r.lucro, +x.l.valor)}</td><td class="num">${sinal(x.r.liquido)}</td></tr>${obraAberta === x.l.id ? det(x) : ''}`).join('')}</tbody>
      </table></div>` : '<div class="muted">Nenhuma venda fechada no período.</div>'}
      <p class="muted" style="margin-top:8px">Clique numa obra para ver o detalhe. <b>Lucro da obra</b> = venda − kit − comissão − imposto − diárias lançadas na obra − material do estoque e custos avulsos ligados ao cliente. <b>Lucro líquido</b> desconta também a parte da obra nos custos fixos e salários do mês em que a venda fechou (dividido pelo valor das vendas do mês). Diárias entram quando são lançadas na Equipe com o cliente; obra ainda em andamento pode ter custos por vir.</p>
    </div>`;
}

// ── custos fixos ──
function renderFixos() {
  const ativos = FIXOS.filter(f => f.ativo), total = ativos.reduce((a, f) => a + +f.valor, 0);
  const opt = c => Object.entries(CATEGORIAS).map(([k, n]) => `<option value="${k}" ${k === c ? 'selected' : ''}>${n}</option>`).join('');
  $('aba-fixos').innerHTML = `
    <div class="kpis"><div class="kpi"><div class="kpi-val">${fmtR0(total)}</div><div class="kpi-lbl">Custos fixos por mês (${ativos.length} ativos)</div></div>
      <div class="kpi"><div class="kpi-val">${fmtR0(PAG.filter(x => x.tipo === 'salario' && x.competencia === $('f-mes').value + '-01').reduce((a, x) => a + +x.valor, 0))}</div><div class="kpi-lbl">Salários da equipe fixa (vêm do cadastro da equipe)</div></div></div>
    <div class="card"><div class="linha-topo"><h2>🏢 Custos fixos mensais</h2><button class="btn" onclick="novoFixo()">+ Custo fixo</button></div>
      <div class="tabela-wrap"><table><thead><tr><th>Nome</th><th>Categoria</th><th class="num">Valor mensal</th><th>Dia venc.</th><th>Ativo</th><th></th></tr></thead><tbody>
      ${FIXOS.map(f => `<tr><td><input class="input" value="${esc(f.nome)}" onchange="salvarFixo(${f.id}, 'nome', this.value)"></td>
        <td><select class="select" onchange="salvarFixo(${f.id}, 'categoria', this.value)">${opt(f.categoria)}</select></td>
        <td class="num"><input class="input" style="width:110px;text-align:right" inputmode="decimal" value="${(+f.valor).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}" onchange="salvarFixo(${f.id}, 'valor', this.value)"></td>
        <td><input class="input" style="width:64px" type="number" min="1" max="31" value="${f.dia_vencimento}" onchange="salvarFixo(${f.id}, 'dia_vencimento', this.value)"></td>
        <td><input type="checkbox" ${f.ativo ? 'checked' : ''} onchange="salvarFixo(${f.id}, 'ativo', this.checked)"></td>
        <td><button class="btn btn-sec btn-p" style="color:var(--vermelho)" onclick="apagarFixo(${f.id})">🗑</button></td></tr>`).join('') || '<tr><td colspan="6" class="vazio">Nenhum custo fixo cadastrado. Ex.: aluguel, internet, marketing, contador, sistemas.</td></tr>'}
      </tbody></table></div>
      <p class="muted" style="margin-top:8px">Todo mês o sistema cria sozinho a conta a pagar de cada custo ativo (aba Contas do mês). Mudar o valor aqui vale para os próximos meses; a conta do mês já criada pode ser ajustada no ✏.</p>
    </div>`;
}
async function novoFixo() {
  const nome = prompt('Nome do custo fixo (ex.: Aluguel da sede, Internet, Anúncios Meta):'); if (!nome) return;
  const v = numBR(prompt('Valor mensal (R$):')); if (v === null) return;
  const dia = Math.min(31, Math.max(1, parseInt(prompt('Dia do vencimento (1 a 31):', '10'), 10) || 10));
  const cat = /alug/i.test(nome) ? 'aluguel' : /internet|telefone|celular/i.test(nome) ? 'internet_telefone' : /market|anúnc|anunc|meta|google|tráfego|trafego/i.test(nome) ? 'marketing' : /contab|contador/i.test(nome) ? 'contador' : /energia|água|agua|luz/i.test(nome) ? 'energia_agua' : /carro|ve[ií]culo|combust/i.test(nome) ? 'veiculo' : /sistema|software|app/i.test(nome) ? 'software' : 'outros';
  const { data, error } = await sb.from('custos_fixos').insert({ nome, valor: v, dia_vencimento: dia, categoria: cat }).select('*').single();
  if (error) { msg('⚠ ' + error.message, true); return; }
  FIXOS.push(data); await carregar();
}
async function salvarFixo(id, campo, valor) {
  const mud = {}; if (campo === 'valor') { const n = numBR(valor); if (n === null) return; mud.valor = n; } else if (campo === 'dia_vencimento') mud.dia_vencimento = Math.min(31, Math.max(1, +valor || 10)); else mud[campo] = valor;
  const { error } = await sb.from('custos_fixos').update(mud).eq('id', id);
  if (error) { msg('⚠ ' + error.message, true); return; }
  Object.assign(FIXOS.find(f => f.id === id), mud); msg('✅ Salvo'); renderFixos();
}
async function apagarFixo(id) {
  const f = FIXOS.find(x => x.id === id); if (!f || !confirm('Apagar o custo fixo "' + f.nome + '"? (as contas já lançadas ficam; para só parar de lançar, desmarque "Ativo")')) return;
  const { error } = await sb.from('custos_fixos').delete().eq('id', id); if (error) { msg('⚠ ' + error.message, true); return; }
  FIXOS = FIXOS.filter(x => x.id !== id); renderFixos();
}

// ── parâmetros ──
function renderParam() {
  $('aba-param').innerHTML = `<div class="card"><h2>⚙ Parâmetros do financeiro</h2>
    <div class="kpis" style="grid-template-columns:repeat(auto-fit, minmax(220px, 1fr))">
      <label class="muted">Simples Nacional sobre serviços (%)<input class="input" id="p-simples" inputmode="decimal" value="${String(PRM.simples_pct ?? 6).replace('.', ',')}"></label>
      <label class="muted">Dia de vencimento do DAS (mês seguinte)<input class="input" id="p-das" type="number" min="1" max="28" value="${PRM.das_dia ?? 20}"></label>
      <label class="muted">Dia de pagamento de salários e diárias (mês seguinte)<input class="input" id="p-sal" type="number" min="1" max="28" value="${PRM.salario_dia ?? 5}"></label>
      <label class="muted">Ganhos a partir de (entram automático no a pagar)<input class="input" id="p-ini" type="date" value="${PRM.inicio || ''}"></label>
    </div>
    <button class="btn" onclick="salvarParam()">💾 Salvar parâmetros</button>
    <p class="muted" style="margin-top:10px">Serviços = valor total − valor do kit na proposta (kit separado) ou total − custo do kit (estimado). O Simples, a comissão e o kit ainda não pagos são recalculados sozinhos se a venda ou o custo mudar; o que já foi pago não muda.</p></div>`;
}
async function salvarParam() {
  const mud = { simples_pct: numBR($('p-simples').value) ?? 6, das_dia: Math.min(28, Math.max(1, +$('p-das').value || 20)), salario_dia: Math.min(28, Math.max(1, +$('p-sal').value || 5)), inicio: $('p-ini').value || PRM.inicio, atualizado_em: new Date().toISOString() };
  const { error } = await sb.from('fin_parametros').update(mud).eq('id', 1);
  if (error) { msg('⚠ ' + error.message, true); return; }
  msg('✅ Parâmetros salvos.'); await carregar();
}

iniciar();
</script>
</body>
</html>
